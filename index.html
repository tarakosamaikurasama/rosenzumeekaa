<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>架空路線マップメーカー</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
crossorigin="">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}

/* =========================
   上部
========================= */

#topbar{
  height:58px;
  min-height:58px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  overflow-x:auto;
  z-index:5000;
}

#title{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  margin-right:10px;
}

.toolButton{
  border:1px solid #777;
  background:white;
  color:#111;
  border-radius:5px;
  padding:8px 12px;
  cursor:pointer;
  white-space:nowrap;
  font-size:13px;
}

.toolButton:hover{
  background:#eee;
}

.toolButton.active{
  background:#ff8800;
  border-color:#ff8800;
  color:white;
}

/* =========================
   メイン
========================= */

#main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

#sidebar{
  width:300px;
  min-width:300px;
  background:#f2f2f2;
  border-right:1px solid #aaa;
  overflow-y:auto;
  padding:10px;
  z-index:4000;
}

.section{
  background:white;
  border:1px solid #ccc;
  border-radius:7px;
  padding:10px;
  margin-bottom:10px;
}

.sectionTitle{
  font-weight:bold;
  font-size:15px;
  margin-bottom:8px;
}

.row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
}

.row label{
  flex:1;
  font-size:13px;
}

input[type="text"]{
  width:100%;
  border:1px solid #aaa;
  border-radius:4px;
  padding:7px;
  font-size:14px;
}

input[type="number"]{
  width:75px;
  border:1px solid #aaa;
  border-radius:4px;
  padding:6px;
}

input[type="color"]{
  width:55px;
  height:34px;
  padding:2px;
  border:1px solid #aaa;
}

.actionButton{
  width:100%;
  border:1px solid #999;
  background:white;
  border-radius:5px;
  padding:8px;
  cursor:pointer;
}

.actionButton:hover{
  background:#eee;
}

/* =========================
   選択情報
========================= */

#selectedInfo{
  font-size:13px;
  line-height:1.6;
}

#selectedName{
  margin-top:5px;
}

/* =========================
   路線一覧
========================= */

#routeList{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.routeItem{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  border:1px solid #ccc;
  border-radius:5px;
  background:#fafafa;
}

.routeItem.selected{
  border:2px solid #ff8800;
}

.routeColor{
  width:20px;
  height:20px;
  border-radius:50%;
  border:1px solid #555;
  flex:none;
}

.routeName{
  flex:1;
  min-width:0;
}

.routeName input{
  width:100%;
  border:0;
  background:transparent;
  font-size:13px;
  padding:2px;
  outline:none;
}

.routeSelect{
  padding:5px 7px;
  border:1px solid #999;
  border-radius:4px;
  background:white;
  cursor:pointer;
}

/* =========================
   地図
========================= */

#map{
  flex:1;
  min-width:0;
  min-height:0;
  position:relative;
}

#modeDisplay{
  position:absolute;
  left:10px;
  top:10px;
  z-index:2000;
  background:white;
  border:1px solid #888;
  border-radius:5px;
  padding:7px 10px;
  font-size:13px;
  box-shadow:0 1px 5px rgba(0,0,0,.35);
}

#north{
  position:absolute;
  right:12px;
  top:12px;
  z-index:2000;
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  border:1px solid #888;
  box-shadow:0 1px 5px rgba(0,0,0,.3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:20px;
}

/* =========================
   駅
========================= */

.station-marker{
  background:white;
  border:3px solid #111;
  border-radius:50%;
}

.branch-marker{
  background:#111;
  border:2px solid white;
  border-radius:50%;
}

.selected-marker{
  box-shadow:
    0 0 0 3px #ff8800,
    0 0 8px rgba(255,136,0,.9);
}

.station-label{
  background:white;
  border:1px solid #999;
  border-radius:3px;
  box-shadow:none;
  color:#111;
  font-weight:bold;
  padding:2px 4px;
  white-space:nowrap;
}

/* =========================
   駅名直接入力
========================= */

.mapNameEditor{
  background:white;
  border:2px solid #ff8800;
  border-radius:5px;
  padding:3px;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}

.mapNameEditor input{
  width:150px;
  border:0;
  outline:none;
  font-size:14px;
  padding:5px;
}

/* =========================
   モバイル
========================= */

#menuButton{
  display:none;
  position:absolute;
  bottom:10px;
  left:10px;
  z-index:5000;
  border:1px solid #777;
  background:white;
  border-radius:5px;
  padding:9px 12px;
}

@media(max-width:800px){

  #sidebar{
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    transform:translateX(-100%);
    transition:transform .2s;
    box-shadow:2px 0 8px rgba(0,0,0,.4);
  }

  #sidebar.open{
    transform:translateX(0);
  }

  #menuButton{
    display:block;
  }

  #title{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="topbar">

  <div id="title">
    架空路線マップメーカー
  </div>

  <button class="toolButton active" id="selectMode">
    選択
  </button>

  <button class="toolButton" id="moveMode">
    移動
  </button>

  <button class="toolButton" id="stationMode">
    駅を追加
  </button>

  <button class="toolButton" id="branchMode">
    分岐・方向転換点
  </button>

  <button class="toolButton" id="deleteMode">
    削除
  </button>

</div>


<div id="main">

  <aside id="sidebar">

    <div class="section">

      <div class="sectionTitle">
        選択中
      </div>

      <div id="selectedInfo">
        何も選択されていません
      </div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        路線
      </div>

      <input
        id="routeName"
        type="text"
        placeholder="路線名"
      >

      <div class="row">
        <label>路線色</label>
        <input
          id="routeColor"
          type="color"
          value="#ff0000"
        >
      </div>

      <div class="row">
        <label>線の太さ</label>
        <input
          id="routeWidth"
          type="number"
          min="1"
          max="30"
          value="6"
        >
      </div>

      <button
        class="actionButton"
        id="addRoute"
      >
        路線を追加
      </button>

    </div>


    <div class="section">

      <div class="sectionTitle">
        全体表示設定
      </div>

      <div class="row">
        <label>線の太さ</label>
        <input
          id="globalWidth"
          type="number"
          min="1"
          max="30"
          value="6"
        >
      </div>

      <div class="row">
        <label>駅の大きさ</label>
        <input
          id="globalStationSize"
          type="number"
          min="4"
          max="40"
          value="12"
        >
      </div>

      <div class="row">
        <label>分岐点の大きさ</label>
        <input
          id="globalBranchSize"
          type="number"
          min="3"
          max="30"
          value="7"
        >
      </div>

      <div class="row">
        <label>駅名の大きさ</label>
        <input
          id="globalLabelSize"
          type="number"
          min="8"
          max="40"
          value="14"
        >
      </div>

      <button
        class="actionButton"
        id="applySettings"
      >
        全体設定を適用
      </button>

    </div>


    <div class="section">

      <div class="sectionTitle">
        路線一覧
      </div>

      <div id="routeList"></div>

    </div>


    <div class="section">

      <div class="sectionTitle">
        データ
      </div>

      <div class="row">

        <button
          class="actionButton"
          id="saveData"
        >
          保存
        </button>

        <button
          class="actionButton"
          id="loadData"
        >
          読込
        </button>

      </div>

      <div class="row">

        <button
          class="actionButton"
          id="exportData"
        >
          JSON出力
        </button>

        <button
          class="actionButton"
          id="importData"
        >
          JSON読込
        </button>

      </div>

      <input
        type="file"
        id="fileInput"
        accept=".json,application/json"
        style="display:none"
      >

    </div>


    <div class="section">

      <div class="sectionTitle">
        操作方法
      </div>

      <div style="font-size:12px;line-height:1.8">

        <b>路線を選択</b><br>
        路線一覧から路線を選択すると、
        その路線に点を順番に接続できます。

        <br><br>

        <b>連続接続</b><br>
        路線を選択した状態で<br>
        駅A → 駅B → 分岐点C → 駅D<br>
        とクリックすると、順番に接続されます。

        <br><br>

        <b>重要</b><br>
        駅→駅、駅→分岐点、
        分岐点→分岐点のすべてを接続できます。

        <br><br>

        <b>駅名</b><br>
        駅を追加すると、地図上に駅名入力欄が出ます。
        直接入力できます。
        選択後も駅名を変更できます。

        <br><br>

        <b>移動</b><br>
        駅や分岐点をドラッグします。
        接続された線も追従します。

      </div>

    </div>

  </aside>


  <div id="map">

    <div id="modeDisplay">
      モード：選択
    </div>

    <div id="north">
      N
    </div>

  </div>

  <button id="menuButton">
    メニュー
  </button>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
crossorigin="">
</script>


<script>

(function(){

"use strict";


/* =========================================================
   地図
========================================================= */

const map=L.map("map",{
  zoomControl:true,
  attributionControl:true
});

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);

map.setView(
  [35.681236,139.767125],
  13
);


/* =========================================================
   レイヤー
========================================================= */

const lineLayer=L.layerGroup().addTo(map);
const pointLayer=L.layerGroup().addTo(map);


/* =========================================================
   データ
========================================================= */

let stations=[];
let branches=[];
let connections=[];
let routes=[];

let nextId=1;

let selectedRouteId=null;
let selectedPointId=null;

let mode="select";

let firstConnectionPoint=null;


/* =========================================================
   設定
========================================================= */

let settings={
  globalWidth:6,
  stationSize:12,
  branchSize:7,
  labelSize:14
};


/* =========================================================
   ID
========================================================= */

function createId(){
  return nextId++;
}


/* =========================================================
   全点
========================================================= */

function allPoints(){
  return stations.concat(branches);
}


/* =========================================================
   点検索
========================================================= */

function findPoint(pointId){

  return allPoints().find(
    p=>p.id===pointId
  ) || null;

}


/* =========================================================
   モード
========================================================= */

const modeButtons={
  select:document.getElementById("selectMode"),
  move:document.getElementById("moveMode"),
  station:document.getElementById("stationMode"),
  branch:document.getElementById("branchMode"),
  delete:document.getElementById("deleteMode")
};


function setMode(newMode){

  mode=newMode;

  firstConnectionPoint=null;

  Object.values(modeButtons).forEach(
    b=>b.classList.remove("active")
  );

  modeButtons[newMode].classList.add("active");

  const names={
    select:"選択",
    move:"移動",
    station:"駅を追加",
    branch:"分岐・方向転換点",
    delete:"削除"
  };

  document.getElementById(
    "modeDisplay"
  ).textContent=
    "モード："+names[newMode];

  render();

}


modeButtons.select.onclick=()=>{
  setMode("select");
};

modeButtons.move.onclick=()=>{
  setMode("move");
};

modeButtons.station.onclick=()=>{
  setMode("station");
};

modeButtons.branch.onclick=()=>{
  setMode("branch");
};

modeButtons.delete.onclick=()=>{
  setMode("delete");
};


/* =========================================================
   地図クリック
========================================================= */

map.on("click",function(e){

  if(mode==="station"){
    addStation(e.latlng);
    return;
  }

  if(mode==="branch"){
    addBranch(e.latlng);
    return;
  }

});


/* =========================================================
   駅追加
========================================================= */

function addStation(latlng){

  const station={
    id:createId(),
    name:"",
    lat:latlng.lat,
    lng:latlng.lng
  };

  stations.push(station);

  selectedPointId=station.id;

  render();

  openNameEditor(station);

}


/* =========================================================
   駅名入力
========================================================= */

function openNameEditor(station){

  const size=settings.stationSize;

  const editor=L.marker(
    [station.lat,station.lng],
    {
      interactive:true,
      zIndexOffset:5000,
      icon:L.divIcon({

        className:"",

        html:
          '<div class="mapNameEditor">'+
          '<input id="stationNameEditor" '+
          'type="text" '+
          'placeholder="駅名を入力">'+
          '</div>',

        iconSize:null,

        iconAnchor:[
          75,
          size/2
        ]

      })
    }
  ).addTo(map);


  const input=
    document.getElementById(
      "stationNameEditor"
    );


  input.focus();


  input.value=station.name;


  input.addEventListener(
    "input",
    function(){

      station.name=this.value;

      renderStationLabelsOnly();

    }
  );


  input.addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){

        station.name=
          this.value.trim();

        map.removeLayer(editor);

        render();

      }

      if(e.key==="Escape"){

        map.removeLayer(editor);

        render();

      }

    }
  );


  input.addEventListener(
    "blur",
    function(){

      station.name=
        this.value.trim();

      if(map.hasLayer(editor)){
        map.removeLayer(editor);
      }

      render();

    }
  );

}


/* =========================================================
   分岐点追加
========================================================= */

function addBranch(latlng){

  const branch={
    id:createId(),
    lat:latlng.lat,
    lng:latlng.lng
  };

  branches.push(branch);

  selectedPointId=branch.id;

  render();

}


/* =========================================================
   点クリック
========================================================= */

function pointClicked(point,e){

  L.DomEvent.stopPropagation(e);


  /* 削除 */

  if(mode==="delete"){

    deletePoint(point);

    return;
  }


  /* 路線が選択されている場合
     クリックするだけで連続接続 */

  if(selectedRouteId){

    connectPointToSelectedRoute(point);

    return;
  }


  /* 選択 */

  selectedPointId=point.id;

  updateSelectedInfo();

  render();

}


/* =========================================================
   選択路線への連続接続
========================================================= */

function connectPointToSelectedRoute(point){

  const route=
    routes.find(
      r=>r.id===selectedRouteId
    );

  if(!route){
    return;
  }


  /*
    直前にクリックした点を取得。
    路線内で最後に追加された点から
    今回クリックした点へ接続する。
  */

  const routeConnections=
    connections.filter(
      c=>c.routeId===route.id
    );


  let lastPointId=null;


  if(routeConnections.length){

    /*
      路線の末端を探す。

      「一直線につなぐ」操作なので、
      最後に追加した接続のBを末端として扱う。
    */

    const last=
      routeConnections[
        routeConnections.length-1
      ];

    lastPointId=last.b;

  }


  /*
    初回なら、この点を路線の開始点にする。
  */

  if(lastPointId===null){

    selectedPointId=point.id;

    updateSelectedInfo();

    render();

    return;
  }


  /*
    同じ点なら何もしない
  */

  if(lastPointId===point.id){

    selectedPointId=point.id;

    updateSelectedInfo();

    return;
  }


  const previous=
    findPoint(lastPointId);


  if(!previous){
    return;
  }


  createConnection(
    previous,
    point,
    route.id
  );


  selectedPointId=point.id;

  render();

}


/* =========================================================
   接続作成
========================================================= */

function createConnection(
  pointA,
  pointB,
  routeId
){

  const exists=
    connections.some(
      c=>
        c.routeId===routeId &&
        (
          (
            c.a===pointA.id &&
            c.b===pointB.id
          ) ||
          (
            c.a===pointB.id &&
            c.b===pointA.id
          )
        )
    );


  if(exists){
    return;
  }


  connections.push({

    id:createId(),

    a:pointA.id,

    b:pointB.id,

    routeId:routeId

  });

}


/* =========================================================
   点削除
========================================================= */

function deletePoint(point){

  stations=
    stations.filter(
      s=>s.id!==point.id
    );

  branches=
    branches.filter(
      b=>b.id!==point.id
    );

  connections=
    connections.filter(
      c=>
        c.a!==point.id &&
        c.b!==point.id
    );


  if(selectedPointId===point.id){
    selectedPointId=null;
  }


  render();

}


/* =========================================================
   線クリック
========================================================= */

function connectionClicked(
  connection,
  e
){

  L.DomEvent.stopPropagation(e);


  if(mode==="delete"){

    connections=
      connections.filter(
        c=>c.id!==connection.id
      );

    render();

    return;
  }

}


/* =========================================================
   駅アイコン
========================================================= */

function stationIcon(selected){

  const size=settings.stationSize;

  return L.divIcon({

    className:"",

    html:
      '<div class="station-marker '+
      (selected?"selected-marker":"")+
      '" style="' +
      'width:'+size+'px;' +
      'height:'+size+'px;' +
      '"></div>',

    iconSize:[
      size,
      size
    ],

    iconAnchor:[
      size/2,
      size/2
    ]

  });

}


/* =========================================================
   分岐アイコン
========================================================= */

function branchIcon(selected){

  const size=settings.branchSize;

  return L.divIcon({

    className:"",

    html:
      '<div class="branch-marker '+
      (selected?"selected-marker":"")+
      '" style="' +
      'width:'+size+'px;' +
      'height:'+size+'px;' +
      '"></div>',

    iconSize:[
      size,
      size
    ],

    iconAnchor:[
      size/2,
      size/2
    ]

  });

}


/* =========================================================
   点描画
========================================================= */

function renderPoints(){

  pointLayer.clearLayers();


  /* 駅 */

  stations.forEach(
    station=>{

      const marker=
        L.marker(
          [
            station.lat,
            station.lng
          ],
          {
            icon:stationIcon(
              selectedPointId===
              station.id
            ),
            draggable:
              mode==="move"
          }
        );


      if(station.name){

        marker.bindTooltip(
          escapeHTML(
            station.name
          ),
          {
            permanent:true,
            direction:"top",
            offset:[
              0,
              -(settings.stationSize/2)-4
            ],
            className:
              "station-label"
          }
        );

      }


      marker.on(
        "click",
        e=>
          pointClicked(
            station,
            e
          )
      );


      marker.on(
        "dragend",
        e=>{

          if(mode!=="move"){
            return;
          }

          const pos=
            e.target.getLatLng();

          station.lat=
            pos.lat;

          station.lng=
            pos.lng;

          renderLines();

        }
      );


      marker.addTo(pointLayer);

    }
  );


  /* 分岐点 */

  branches.forEach(
    branch=>{

      const marker=
        L.marker(
          [
            branch.lat,
            branch.lng
          ],
          {
            icon:branchIcon(
              selectedPointId===
              branch.id
            ),
            draggable:
              mode==="move"
          }
        );


      marker.on(
        "click",
        e=>
          pointClicked(
            branch,
            e
          )
      );


      marker.on(
        "dragend",
        e=>{

          if(mode!=="move"){
            return;
          }

          const pos=
            e.target.getLatLng();

          branch.lat=
            pos.lat;

          branch.lng=
            pos.lng;

          renderLines();

        }
      );


      marker.addTo(pointLayer);

    }
  );

}


/* =========================================================
   駅名だけ更新
========================================================= */

function renderStationLabelsOnly(){

  stations.forEach(
    station=>{

      if(!station.marker){
        return;
      }

      const tooltip=
        station.marker.getTooltip();

      if(tooltip){

        tooltip.setContent(
          escapeHTML(
            station.name
          )
        );

      }else if(station.name){

        station.marker.bindTooltip(
          escapeHTML(
            station.name
          ),
          {
            permanent:true,
            direction:"top",
            offset:[
              0,
              -(settings.stationSize/2)-4
            ],
            className:
              "station-label"
          }
        );

      }

    }
  );

}


/* =========================================================
   線描画
========================================================= */

function renderLines(){

  lineLayer.clearLayers();


  connections.forEach(
    connection=>{

      const a=
        findPoint(
          connection.a
        );

      const b=
        findPoint(
          connection.b
        );


      if(!a || !b){
        return;
      }


      const route=
        routes.find(
          r=>r.id===
          connection.routeId
        );


      if(!route){
        return;
      }


      const line=
        L.polyline(
          [
            [
              a.lat,
              a.lng
            ],
            [
              b.lat,
              b.lng
            ]
          ],
          {
            color:route.color,
            weight:
              settings.globalWidth,
            opacity:1,
            lineCap:"round",
            lineJoin:"round"
          }
        );


      line.on(
        "click",
        e=>
          connectionClicked(
            connection,
            e
          )
      );


      line.addTo(lineLayer);

    }
  );


  renderRouteLabels();

}


/* =========================================================
   路線名
========================================================= */

function renderRouteLabels(){

  routes.forEach(
    route=>{

      const routeConnections=
        connections.filter(
          c=>
            c.routeId===
            route.id
        );


      if(!routeConnections.length){
        return;
      }


      const middle=
        routeConnections[
          Math.floor(
            routeConnections.length/2
          )
        ];


      const a=
        findPoint(middle.a);

      const b=
        findPoint(middle.b);


      if(!a || !b){
        return;
      }


      const lat=
        (a.lat+b.lat)/2;

      const lng=
        (a.lng+b.lng)/2;


      const label=
        L.marker(
          [
            lat,
            lng
          ],
          {
            interactive:false,
            icon:L.divIcon({

              className:"",

              html:
                '<div style="' +
                'font-size:13px;' +
                'font-weight:bold;' +
                'background:rgba(255,255,255,.88);' +
                'padding:2px 5px;' +
                'border-radius:3px;' +
                'white-space:nowrap;' +
                '">' +
                escapeHTML(
                  route.name
                ) +
                '</div>',

              iconSize:null

            })
          }
        );


      label.addTo(lineLayer);

    }
  );

}


/* =========================================================
   描画
========================================================= */

function render(){

  renderLines();

  renderPoints();

  renderRouteList();

  updateSelectedInfo();

}


/* =========================================================
   選択情報
========================================================= */

function updateSelectedInfo(){

  const box=
    document.getElementById(
      "selectedInfo"
    );


  if(!selectedPointId){

    box.textContent=
      "何も選択されていません";

    return;
  }


  const point=
    findPoint(
      selectedPointId
    );


  if(!point){

    box.textContent=
      "何も選択されていません";

    return;
  }


  const station=
    stations.find(
      s=>s.id===point.id
    );


  if(station){

    box.innerHTML=
      "駅<br>"+
      '<input id="selectedName" '+
      'type="text" '+
      'value="'+
      escapeAttribute(
        station.name
      )+
      '" '+
      'placeholder="駅名">';


    const input=
      document.getElementById(
        "selectedName"
      );


    input.addEventListener(
      "input",
      function(){

        station.name=
          this.value;

        renderStationLabelsOnly();

      }
    );

  }else{

    box.textContent=
      "分岐・方向転換点";

  }

}


/* =========================================================
   エスケープ
========================================================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================================================
   路線追加
========================================================= */

document.getElementById(
  "addRoute"
).onclick=function(){

  const route={

    id:createId(),

    name:
      document.getElementById(
        "routeName"
      ).value.trim()
      ||"新しい路線",

    color:
      document.getElementById(
        "routeColor"
      ).value,

    width:

        document.getElementById(
          "routeWidth"
        ).value
      )||6

  selectedRouteId=
    route.id;

    "routeName"
  ).value="";


  render();

};


/* =========================================================
   路線一覧
========================================================= */

function renderRouteList(){

  const list=
    document.getElementById(
      "routeList"
    );

  list.innerHTML="";


  routes.forEach(
    route=>{

      const item=
        document.createElement(
          "div"
        );

      item.className=
        "routeItem"+
        (
          selectedRouteId===
          route.id
            ?" selected"
            :""
        );


      const color=
        document.createElement(
          "div"
        );

      color.className=
        "routeColor";

      color.style.background=
        route.color;


      const nameBox=
        document.createElement(
          "div"
        );

      nameBox.className=
        "routeName";


      const input=
        document.createElement(
          "input"
        );

      input.type="text";

      input.value=
        route.name;


      input.addEventListener(
        "input",
        function(){

          route.name=
            this.value;

          renderLines();

        }
      );


      const select=
        document.createElement(
          "button"
        );

      select.className=
        "routeSelect";

      select.textContent=
        "選択";


      select.onclick=
        function(){

          selectedRouteId=
            route.id;

          document.getElementById(
            "routeName"
          ).value=
            route.name;

          document.getElementById(
            "routeColor"
          ).value=
            route.color;

          document.getElementById(
            "routeWidth"
          ).value=
            route.width;

          selectedPointId=null;

          render();

        };


      nameBox.appendChild(
        input
      );

      item.appendChild(
        color
      );

      item.appendChild(
        nameBox
      );

      item.appendChild(
        select
      );

      list.appendChild(
        item
      );

    }
  );

}

/* =========================================================
   データ作成
========================================================= */

function makeData(){

  const center=
    map.getCenter();


  return {

    version:3,

    stations:
      stations.map(
        s=>({
          id:s.id,
          name:s.name,
          lat:s.lat,
          lng:s.lng
        })
      ),

    branches:
      branches.map(
        b=>({
          id:b.id,
          lat:b.lat,
          lng:b.lng
        })
      ),

    connections:
      connections.map(
        c=>({
          id:c.id,
          a:c.a,
          b:c.b,
          routeId:c.routeId
        })
      ),

    routes:
      routes.map(
        r=>({
          id:r.id,
          name:r.name,
          color:r.color,
          width:r.width
        })
      ),

    settings:
      Object.assign(
        {},
        settings
      ),

    selectedRouteId:
      selectedRouteId,

    center:{
      lat:center.lat,
      lng:center.lng
    },

    zoom:
      map.getZoom()

  };

}

    localStorage.getItem(

  }


  try{

    loadData(
      JSON.parse(raw)
    );

  }catch(e){}

};


/* =========================================================
   データ読み込み
========================================================= */

function loadData(data){

  stations=
    Array.isArray(
      data.stations
    )
      ?data.stations.map(
        s=>({
          id:s.id,
          name:s.name||"",
          lat:Number(s.lat),
          lng:Number(s.lng)
        })
      )
      :[];


  branches=
    Array.isArray(
      data.branches
    )
      ?data.branches.map(
        b=>({
          id:b.id,
          lat:Number(b.lat),
          lng:Number(b.lng)
        })
      )
      :[];


  routes=
    Array.isArray(
      data.routes
    )
      ?data.routes.map(
        r=>({
          id:r.id,
          name:r.name||"新しい路線",
          color:r.color||"#ff0000",
          width:Number(r.width)||6
        })
      )
      :[];


  connections=
    Array.isArray(
      data.connections
    )
      ?data.connections.map(
        c=>({
          id:c.id,
          a:c.a,
          b:c.b,
          routeId:c.routeId
        })
      )
      :[];


  if(data.settings){

    settings=
      Object.assign(
        settings,
        data.settings
      );

  }


  selectedRouteId=
    data.selectedRouteId||
    null;


  const ids=
    stations
      .concat(branches)
      .concat(routes)
      .concat(connections)
      .map(
        x=>Number(x.id)
      )
      .filter(
        Number.isFinite
      );


  nextId=
    ids.length
      ?Math.max.apply(
        null,
        ids
      )+1
      :1;


  document.getElementById(
    "globalWidth"
  ).value=
    settings.globalWidth;


  document.getElementById(
    "globalStationSize"
  ).value=
    settings.stationSize;


  document.getElementById(
    "globalBranchSize"
  ).value=
    settings.branchSize;


  document.getElementById(
    "globalLabelSize"
  ).value=
    settings.labelSize;


  if(data.center){

    map.setView(
      [
        data.center.lat,
        data.center.lng
      ],
      data.zoom||13
    );

  }


  render();

}


/* =========================================================
   JSON出力
========================================================= */

document.getElementById(
  "exportData"
).onclick=function(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          makeData(),
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const a=
    document.createElement(
      "a"
    );


  a.href=url;

  a.download=
    "fictional-route-map.json";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

};


/* =========================================================
   JSON読込
========================================================= */

document.getElementById(
  "importData"
).onclick=function(){

  document.getElementById(
    "fileInput"
  ).click();

};


document.getElementById(
  "fileInput"
).addEventListener(
  "change",
  function(){

    const file=
      this.files[0];

    if(!file){
      return;
    }


    const reader=
      new FileReader();


    reader.onload=
      function(){

        try{

          loadData(
            JSON.parse(
              reader.result
            )
          );

        }catch(e){}

      };


    reader.readAsText(file);

    this.value="";

  }
);
