<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>架空路線マップメーカー</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  color:#171717;
  background:#f4f4f4;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
  height:60px;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  background:#202020;
  color:#fff;
  overflow-x:auto;
  z-index:9000;
}

#appTitle{
  font-size:17px;
  font-weight:800;
  white-space:nowrap;
  margin-right:8px;
}

.toolButton{
  height:42px;
  padding:0 13px;
  border:1px solid #777;
  border-radius:6px;
  background:#fff;
  color:#111;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  flex:none;
}

.toolButton:hover{
  background:#ededed;
}

.toolButton.active{
  background:#dd6a34;
  border-color:#dd6a34;
  color:#fff;
}

/* =========================================================
   MAIN
========================================================= */

#main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

#sidebar{
  width:330px;
  min-width:330px;
  height:100%;
  background:#f1f1f1;
  border-right:1px solid #bcbcbc;
  overflow-y:auto;
  padding:10px;
  z-index:6000;
}

.section{
  background:#fff;
  border:1px solid #d0d0d0;
  border-radius:8px;
  padding:10px;
  margin-bottom:10px;
}

.sectionTitle{
  font-size:15px;
  font-weight:800;
  margin-bottom:9px;
}

.smallText{
  font-size:12px;
  line-height:1.65;
  color:#444;
}

.row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
}

.row label{
  flex:1;
  font-size:13px;
  font-weight:600;
}

input[type="text"],
input[type="number"]{
  width:100%;
  min-width:0;
  border:1px solid #aaa;
  border-radius:5px;
  background:#fff;
  padding:8px;
  outline:none;
}

input[type="text"]:focus,
input[type="number"]:focus{
  border-color:#dd6a34;
  box-shadow:0 0 0 2px rgba(221,106,52,.12);
}

input[type="color"]{
  width:58px;
  height:35px;
  padding:2px;
  border:1px solid #999;
  border-radius:5px;
  background:#fff;
}

.primaryButton{
  width:100%;
  min-height:40px;
  border:0;
  border-radius:6px;
  background:#222;
  color:#fff;
  font-weight:700;
  padding:8px;
}

.primaryButton:hover{
  background:#000;
}

.secondaryButton{
  width:100%;
  min-height:38px;
  border:1px solid #999;
  border-radius:6px;
  background:#fff;
  color:#111;
  font-weight:700;
  padding:7px;
}

.secondaryButton:hover{
  background:#eee;
}

/* =========================================================
   MAP
========================================================= */

#map{
  flex:1;
  min-width:0;
  min-height:0;
  position:relative;
  background:#ddd;
}

#modeDisplay{
  position:absolute;
  left:10px;
  top:10px;
  z-index:2000;
  background:#fff;
  border:1px solid #888;
  border-radius:6px;
  padding:8px 11px;
  font-size:13px;
  font-weight:700;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
}

#connectionDisplay{
  position:absolute;
  left:10px;
  top:55px;
  z-index:2000;
  display:none;
  background:#fff;
  border:1px solid #888;
  border-radius:6px;
  padding:8px 11px;
  font-size:12px;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
}

#north{
  position:absolute;
  right:12px;
  top:12px;
  width:45px;
  height:45px;
  z-index:2000;
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid #888;
  border-radius:50%;
  background:#fff;
  font-size:21px;
  font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,.25);
}

/* =========================================================
   MAP MARKERS
========================================================= */

.station-marker{
  border-radius:50%;
  background:#fff;
  border:3px solid #111;
}

.branch-marker{
  border-radius:50%;
  background:#111;
  border:2px solid #fff;
}

.selected-marker{
  box-shadow:
    0 0 0 3px #ff8800,
    0 0 10px rgba(255,136,0,.9);
}

.connection-start-marker{
  box-shadow:
    0 0 0 4px #ff8800,
    0 0 12px rgba(255,136,0,.9);
}

.station-label{
  background:#fff;
  color:#111;
  border:1px solid #999;
  border-radius:4px;
  padding:2px 5px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  white-space:nowrap;
}

.station-label:before{
  display:none;
}

/* =========================================================
   NAME EDITOR
========================================================= */

.mapNameEditor{
  background:#fff;
  border:2px solid #dd6a34;
  border-radius:6px;
  padding:4px;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}

.mapNameEditor input{
  width:180px;
  border:0;
  outline:0;
  padding:6px;
  font-size:14px;
}

/* =========================================================
   ROUTE LIST
========================================================= */

.routeList{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.routeItem{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fafafa;
}

.routeItem.selected{
  border:2px solid #dd6a34;
}

.routeColor{
  width:22px;
  height:22px;
  flex:none;
  border-radius:50%;
  border:1px solid #555;
}

.routeItemName{
  flex:1;
  min-width:0;
}

.routeItemName input{
  width:100%;
  padding:4px;
  border:0;
  background:transparent;
  outline:0;
  font-weight:700;
}

.routeCodeSmall{
  font-size:11px;
  color:#555;
}

.routeSelectButton{
  flex:none;
  border:1px solid #999;
  border-radius:5px;
  background:#fff;
  padding:6px 8px;
  font-weight:700;
}

/* =========================================================
   LISTS
========================================================= */

.simpleList{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.listButton{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #ccc;
  border-radius:6px;
  background:#fff;
  padding:7px;
  text-align:left;
}

.listButton:hover{
  background:#f3f3f3;
}

.listNumber{
  width:45px;
  flex:none;
  text-align:center;
  font-size:12px;
  font-weight:900;
}

.listText{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================================================
   OVERLAY / DETAILS
========================================================= */

#detailView{
  position:absolute;
  inset:0;
  z-index:10000;
  display:none;
  background:#f4f4f4;
  overflow:auto;
}

#detailView.show{
  display:block;
}

.detailHeader{
  min-height:64px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:#202020;
  color:#fff;
  position:sticky;
  top:0;
  z-index:20;
}

.backButton{
  min-width:80px;
  height:40px;
  border:1px solid #888;
  border-radius:6px;
  background:#fff;
  color:#111;
  font-weight:800;
}

.detailHeaderTitle{
  font-size:18px;
  font-weight:900;
}

.detailBody{
  width:min(1000px,100%);
  margin:0 auto;
  padding:20px;
}

/* =========================================================
   CSS RAIL LOGO
========================================================= */

.railLogo{
  --logo-size:120px;

  width:var(--logo-size);
  height:var(--logo-size);
  flex:none;

  border-radius:25%;
  background:#dd6a34;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:16%;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.08);
}

.railLogoInner{
  width:100%;
  height:100%;
  background:#fff;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  color:#111;
  overflow:hidden;
}

.railLogoCode{
  font-family:
    Arial Black,
    Arial,
    sans-serif;

  font-size:34%;
  line-height:.9;
  font-weight:1000;
  letter-spacing:-.06em;
}

.railLogoNumber{
  margin-top:7%;
  font-family:
    Arial Black,
    Arial,
    sans-serif;

  font-size:32%;
  line-height:.9;
  font-weight:1000;
}

.railLogo.large{
  --logo-size:180px;
  border-radius:27%;
  padding:13%;
}

.railLogo.large .railLogoCode{
  font-size:39%;
}

.railLogo.large .railLogoNumber{
  display:none;
}

.railLogo.small{
  --logo-size:70px;
  border-radius:22%;
  padding:14%;
}

.railLogo.small .railLogoCode{
  font-size:36%;
}

.railLogo.small .railLogoNumber{
  font-size:31%;
  margin-top:8%;
}

/* =========================================================
   ROUTE DETAIL
========================================================= */

.routeHero{
  display:flex;
  align-items:center;
  gap:28px;
  padding:20px;
  background:#fff;
  border:1px solid #d2d2d2;
  border-radius:12px;
  margin-bottom:18px;
}

.routeHeroInfo{
  min-width:0;
}

.routeHeroName{
  font-size:36px;
  font-weight:1000;
  line-height:1.15;
  margin-bottom:7px;
}

.routeHeroCode{
  display:inline-block;
  border-radius:5px;
  padding:5px 10px;
  background:#222;
  color:#fff;
  font-size:15px;
  font-weight:900;
  letter-spacing:.05em;
}

.routeHeroDescription{
  margin-top:14px;
  color:#555;
  font-size:13px;
}

.routeDetailSection{
  background:#fff;
  border:1px solid #d2d2d2;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.routeDetailSectionTitle{
  font-size:21px;
  font-weight:1000;
  margin-bottom:13px;
}

.stationRouteList{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.routeStationRow{
  min-height:80px;
  display:flex;
  align-items:center;
  gap:15px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  padding:8px 12px;
  cursor:pointer;
}

.routeStationRow:hover{
  background:#f8f8f8;
}

.routeStationLogo{
  width:64px;
  flex:none;
  display:flex;
  justify-content:center;
}

.routeStationInfo{
  flex:1;
  min-width:0;
}

.routeStationCode{
  font-size:13px;
  font-weight:900;
  color:#555;
  margin-bottom:3px;
}

.routeStationName{
  font-size:20px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.routeStationArrow{
  color:#999;
  font-size:22px;
  font-weight:900;
}

/* =========================================================
   STATION DETAIL
========================================================= */

.stationHero{
  background:#fff;
  border:1px solid #d2d2d2;
  border-radius:12px;
  padding:24px;
  margin-bottom:18px;
}

.stationHeroName{
  font-size:42px;
  font-weight:1000;
  line-height:1.1;
}

.stationHeroSub{
  margin-top:7px;
  color:#666;
  font-size:13px;
}

.stationRoutes{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.stationRouteCard{
  display:flex;
  align-items:center;
  gap:16px;
  background:#fff;
  border:1px solid #d2d2d2;
  border-radius:12px;
  padding:14px;
}

.stationRouteCardInfo{
  flex:1;
  min-width:0;
}

.stationRouteCardName{
  font-size:24px;
  font-weight:1000;
}

.stationRouteCardCode{
  margin-top:3px;
  color:#666;
  font-weight:800;
}

.stationRouteDetailButton{
  flex:none;
  border:0;
  border-radius:7px;
  background:#222;
  color:#fff;
  padding:11px 14px;
  font-weight:900;
}

.stationRouteDetailButton:hover{
  background:#000;
}

/* =========================================================
   EMPTY
========================================================= */

.emptyBox{
  padding:30px 10px;
  text-align:center;
  color:#777;
  font-size:13px;
}

/* =========================================================
   MOBILE
========================================================= */

#mobileMenuButton{
  display:none;
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:7000;
  border:1px solid #777;
  border-radius:7px;
  background:#fff;
  padding:10px 13px;
  font-weight:800;
  box-shadow:0 2px 7px rgba(0,0,0,.3);
}

@media(max-width:850px){

  #sidebar{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
    transition:transform .2s;
    box-shadow:3px 0 12px rgba(0,0,0,.35);
  }

  #sidebar.open{
    transform:translateX(0);
  }

  #mobileMenuButton{
    display:block;
  }

  .routeHero{
    flex-direction:column;
    align-items:flex-start;
  }

  .routeHeroName{
    font-size:28px;
  }

  .stationHeroName{
    font-size:32px;
  }

  .detailBody{
    padding:12px;
  }

  .stationRouteCard{
    flex-wrap:wrap;
  }

  .stationRouteDetailButton{
    width:100%;
  }

}

/* =========================================================
   VERY SMALL
========================================================= */

@media(max-width:500px){

  #appTitle{
    font-size:14px;
  }

  .toolButton{
    padding:0 9px;
    font-size:12px;
  }

  .routeStationName{
    font-size:17px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div id="topbar">

    <div id="appTitle">
      架空路線マップメーカー
    </div>

    <button
      class="toolButton active"
      id="modeSelect">
      選択
    </button>

    <button
      class="toolButton"
      id="modeMove">
      移動
    </button>

    <button
      class="toolButton"
      id="modeStation">
      駅を追加
    </button>

    <button
      class="toolButton"
      id="modeBranch">
      分岐・方向転換点
    </button>

    <button
      class="toolButton"
      id="modeDelete">
      削除
    </button>

    <button
      class="toolButton"
      id="clearRouteSelection">
      路線選択解除
    </button>

  </div>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <div id="main">

    <aside id="sidebar">

      <!-- 選択中 -->

      <div class="section">

        <div class="sectionTitle">
          選択中
        </div>

        <div
          id="selectedInfo"
          class="smallText">
          何も選択されていません
        </div>

      </div>


      <!-- 路線作成 -->

      <div class="section">

        <div class="sectionTitle">
          路線を作成
        </div>

        <div class="smallText">
          路線コードは JY、JC、JT など自由に設定できます。
        </div>

        <div style="height:7px"></div>

        <input
          id="routeName"
          type="text"
          placeholder="路線名（例：中央線）">

        <div style="height:7px"></div>

        <input
          id="routeCode"
          type="text"
          placeholder="路線コード（例：JC）"
          maxlength="6"
          autocomplete="off">

        <div class="row">

          <label>
            路線色
          </label>

          <input
            id="routeColor"
            type="color"
            value="#ff0000">

        </div>

        <div class="row">

          <label>
            路線固有の線幅
          </label>

          <input
            id="routeWidth"
            type="number"
            min="1"
            max="40"
            value="6">

        </div>

        <button
          class="primaryButton"
          id="addRoute">
          路線を追加
        </button>

      </div>


      <!-- 全体設定 -->

      <div class="section">

        <div class="sectionTitle">
          全体表示設定
        </div>

        <div class="row">

          <label>
            線の太さ
          </label>

          <input
            id="globalWidth"
            type="number"
            min="1"
            max="40"
            value="6">

        </div>

        <div class="row">

          <label>
            駅の大きさ
          </label>

          <input
            id="stationSize"
            type="number"
            min="5"
            max="50"
            value="14">

        </div>

        <div class="row">

          <label>
            分岐点の大きさ
          </label>

          <input
            id="branchSize"
            type="number"
            min="4"
            max="40"
            value="8">

        </div>

        <div class="row">

          <label>
            駅名の文字サイズ
          </label>

          <input
            id="labelSize"
            type="number"
            min="8"
            max="40"
            value="13">

        </div>

        <button
          class="secondaryButton"
          id="applySettings">
          一括設定を適用
        </button>

      </div>


      <!-- 路線一覧 -->

      <div class="section">

        <div class="sectionTitle">
          路線一覧
        </div>

        <div
          id="routeList"
          class="routeList">
        </div>

      </div>


      <!-- 駅一覧 -->

      <div class="section">

        <div class="sectionTitle">
          駅一覧
        </div>

        <div
          id="stationList"
          class="simpleList">
        </div>

      </div>


      <!-- データ -->

      <div class="section">

        <div class="sectionTitle">
          データ
        </div>

        <button
          class="primaryButton"
          id="saveData">
          ローカル保存
        </button>

        <div style="height:7px"></div>

        <button
          class="secondaryButton"
          id="loadData">
          ローカル読込
        </button>

        <div style="height:7px"></div>

        <button
          class="secondaryButton"
          id="exportData">
          JSONを書き出す
        </button>

        <div style="height:7px"></div>

        <button
          class="secondaryButton"
          id="importData">
          JSONを読み込む
        </button>

        <input
          type="file"
          id="fileInput"
          accept=".json,application/json"
          style="display:none">

      </div>


      <!-- 操作説明 -->

      <div class="section">

        <div class="sectionTitle">
          接続方法
        </div>

        <div class="smallText">

          路線一覧の「選択」を押すと接続モードになります。

          <br><br>

          例えば

          <b>豊田 → 日野 → 立川 → 国立</b>

          とクリックすると、

          <br><br>

          豊田―日野<br>
          日野―立川<br>
          立川―国立

          <br><br>

          の3本が作成されます。

          <br><br>

          同じ点を連続してクリックしても、
          自分自身への線は作成されません。

          <br><br>

          分岐点も駅と同じようにクリックできます。

        </div>

      </div>

    </aside>


    <div id="map">

      <div id="modeDisplay">
        モード：選択
      </div>

      <div id="connectionDisplay">
      </div>

      <div id="north">
        N
      </div>

    </div>


    <button id="mobileMenuButton">
      メニュー
    </button>


    <!-- ===================================================
         DETAIL VIEW
    ==================================================== -->

    <div id="detailView">

      <div class="detailHeader">

        <button
          class="backButton"
          id="detailBack">
          ← 戻る
        </button>

        <div
          class="detailHeaderTitle"
          id="detailHeaderTitle">
          詳細
        </div>

      </div>

      <div
        class="detailBody"
        id="detailBody">
      </div>

    </div>

  </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
crossorigin="">
</script>


<script>
"use strict";

/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map",{
    zoomControl:true,
    attributionControl:true
  });

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);

map.setView(
  [35.681236,139.767125],
  13
);


/* =========================================================
   LAYERS
========================================================= */

const lineLayer =
  L.layerGroup().addTo(map);

const pointLayer =
  L.layerGroup().addTo(map);


/* =========================================================
   DATA
========================================================= */

let stations = [];

let branches = [];

let connections = [];

let routes = [];

let nextId = 1;


/* =========================================================
   STATE
========================================================= */

let mode = "select";

let selectedPointId = null;

let selectedRouteId = null;

/*
  現在接続中の直前の点
*/
let connectingPointId = null;


/*
  詳細画面の履歴
*/
let detailHistory = [];


/* =========================================================
   SETTINGS
========================================================= */

let settings = {

  globalWidth:6,

  stationSize:14,

  branchSize:8,

  labelSize:13

};


/* =========================================================
   MODE BUTTONS
========================================================= */

const modeButtons = {

  select:
    document.getElementById("modeSelect"),

  move:
    document.getElementById("modeMove"),

  station:
    document.getElementById("modeStation"),

  branch:
    document.getElementById("modeBranch"),

  delete:
    document.getElementById("modeDelete")

};


/* =========================================================
   ID
========================================================= */

function createId(){

  const id = nextId;

  nextId++;

  return id;

}


/* =========================================================
   ALL POINTS
========================================================= */

function allPoints(){

  return stations.concat(
    branches
  );

}


/* =========================================================
   FIND POINT
========================================================= */

function findPoint(id){

  const station =
    stations.find(
      s => s.id === id
    );

  if(station){
    return station;
  }

  const branch =
    branches.find(
      b => b.id === id
    );

  if(branch){
    return branch;
  }

  return null;

}


/* =========================================================
   FIND STATION
========================================================= */

function findStation(id){

  return stations.find(
    s => s.id === id
  ) || null;

}


/* =========================================================
   FIND ROUTE
========================================================= */

function findRoute(id){

  return routes.find(
    r => r.id === id
  ) || null;

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SAFE ATTRIBUTE
========================================================= */

function escapeAttribute(value){

  return escapeHTML(value);

}


/* =========================================================
   NORMALIZE ROUTE CODE
========================================================= */

function normalizeRouteCode(value){

  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"")
    .slice(0,6);

}


/* =========================================================
   ROUTE STATION ORDER
=========================================================

   route.stationOrder

   [
     stationId1,
     stationId2,
     stationId3
   ]

   の順番で保存する。
========================================================= */

function ensureRouteStationOrder(route){

  if(!Array.isArray(route.stationOrder)){

    route.stationOrder = [];

  }

  return route.stationOrder;

}


/* =========================================================
   ADD STATION TO ROUTE
========================================================= */

function addStationToRoute(
  route,
  stationId
){

  if(!route){
    return;
  }

  const station =
    findStation(stationId);

  if(!station){
    return;
  }

  ensureRouteStationOrder(route);

  if(
    route.stationOrder.includes(
      stationId
    )
  ){

    return;

  }

  route.stationOrder.push(
    stationId
  );

}


/* =========================================================
   GET STATION NUMBER
========================================================= */

function getStationNumber(
  route,
  stationId
){

  if(!route){
    return null;
  }

  ensureRouteStationOrder(route);

  const index =
    route.stationOrder.indexOf(
      stationId
    );

  if(index < 0){
    return null;
  }

  return index + 1;

}


/* =========================================================
   GET STATION CODE
========================================================= */

function getStationCode(
  route,
  stationId
){

  if(!route){
    return "";

  }

  const number =
    getStationNumber(
      route,
      stationId
    );

  if(number === null){
    return "";
  }

  const code =
    normalizeRouteCode(
      route.code
    ) || "XX";

  return (
    code +
    String(number).padStart(
      2,
      "0"
    )
  );

}


/* =========================================================
   STATION ROUTES
========================================================= */

function getRoutesForStation(
  stationId
){

  return routes.filter(
    route => {

      ensureRouteStationOrder(
        route
      );

      return route.stationOrder.includes(
        stationId
      );

    }
  );

}


/* =========================================================
   ROUTE POINTS
========================================================= */

function getRouteConnections(
  routeId
){

  return connections.filter(
    connection =>
      connection.routeId ===
      routeId
  );

}


/* =========================================================
   MODE
========================================================= */

function setMode(newMode){

  mode = newMode;

  connectingPointId = null;

  Object.values(
    modeButtons
  ).forEach(
    button =>
      button.classList.remove(
        "active"
      )
  );

  if(modeButtons[newMode]){

    modeButtons[newMode]
      .classList.add(
        "active"
      );

  }

  const labels = {

    select:
      "選択",

    move:
      "移動",

    station:
      "駅を追加",

    branch:
      "分岐・方向転換点",

    delete:
      "削除"

  };

  document.getElementById(
    "modeDisplay"
  ).textContent =
    "モード：" +
    (
      labels[newMode] ||
      newMode
    );

  updateConnectionDisplay();

  render();

}


/* =========================================================
   MODE BUTTON EVENTS
========================================================= */

modeButtons.select.onclick =
  () => setMode("select");

modeButtons.move.onclick =
  () => setMode("move");

modeButtons.station.onclick =
  () => setMode("station");

modeButtons.branch.onclick =
  () => setMode("branch");

modeButtons.delete.onclick =
  () => setMode("delete");


/* =========================================================
   MAP CLICK
========================================================= */

map.on(
  "click",
  function(e){

    if(mode === "station"){

      addStation(
        e.latlng
      );

      return;

    }

    if(mode === "branch"){

      addBranch(
        e.latlng
      );

      return;

    }

  }
);


/* =========================================================
   ADD STATION
========================================================= */

function addStation(latlng){

  const station = {

    id:createId(),

    name:"",

    lat:latlng.lat,

    lng:latlng.lng

  };

  stations.push(
    station
  );

  selectedPointId =
    station.id;

  render();

  openNameEditor(
    station
  );

}


/* =========================================================
   ADD BRANCH
========================================================= */

function addBranch(latlng){

  const branch = {

    id:createId(),

    lat:latlng.lat,

    lng:latlng.lng

  };

  branches.push(
    branch
  );

  selectedPointId =
    branch.id;

  render();

}


/* =========================================================
   NAME EDITOR
========================================================= */

function openNameEditor(
  station
){

  const editor =
    L.marker(
      [
        station.lat,
        station.lng
      ],
      {
        interactive:true,
        zIndexOffset:10000,

        icon:L.divIcon({

          className:"",

          html:
            '<div class="mapNameEditor">' +
            '<input ' +
            'id="stationNameEditor" ' +
            'type="text" ' +
            'placeholder="駅名を入力" ' +
            'value="' +
            escapeAttribute(
              station.name
            ) +
            '">' +
            '</div>',

          iconSize:null,

          iconAnchor:[
            90,
            10
          ]

        })

      }
    );

  editor.addTo(map);

  const input =
    document.getElementById(
      "stationNameEditor"
    );

  if(!input){
    return;
  }

  input.focus();

  input.select();


  function finish(){

    station.name =
      input.value.trim();

    if(
      map.hasLayer(editor)
    ){

      map.removeLayer(
        editor
      );

    }

    render();

  }


  input.addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();

        finish();

      }

      if(e.key === "Escape"){

        if(
          map.hasLayer(editor)
        ){

          map.removeLayer(
            editor
          );

        }

      }

    }
  );

  input.addEventListener(
    "blur",
    finish
  );

}


/* =========================================================
   STATION ICON
========================================================= */

  connecting

  const size =
    Math.max(
      5,

    );

  let extra = "";

  if(selected){

    extra +=
      " selected-marker";

  }

  if(connecting){

    extra +=
      " connection-start-marker";

  }

  return L.divIcon({

    className:"",

    html:

      'width:' +

      'height:' +

      'px;' +
      '"></div>',

    iconSize:[

      size / 2
    ]

/* =========================================================
   POINT CLICK
========================================================= */

function pointClicked(
  point,
  e
){

  L.DomEvent.stopPropagation(
    e
  );


  /* DELETE */

  if(mode === "delete"){

    deletePoint(
      point
    );

    return;

  }


  /* MOVE */

  if(mode === "move"){

    selectedPointId =
      point.id;

    updateSelectedInfo();

    render();

    return;

  }


  /* CONNECTION */

  if(
    selectedRouteId !== null
  ){

    connectPoint(
      point
    );

    return;

  }


  /* SELECT */

  selectedPointId =
    point.id;

  updateSelectedInfo();

  render();

}


/* =========================================================
   CONNECT POINT
========================================================= */

function connectPoint(
  point
){

  const route =
    findRoute(
      selectedRouteId
    );

  if(!route){

    selectedRouteId =
      null;

    connectingPointId =
      null;

    updateConnectionDisplay();

    render();

    return;

  }


  ensureRouteStationOrder(
    route
  );


  /*
    1回目
  */

  if(
    connectingPointId === null
  ){

    connectingPointId =
      point.id;

    selectedPointId =
      point.id;


    /*
      最初にクリックした駅を
      JY01 / JC01 にする
    */

    if(
      stations.some(
        s => s.id === point.id
      )
    ){

      addStationToRoute(
        route,
        point.id
      );

    }


    updateConnectionDisplay();

    render();

    return;

  }


  /*
    同じ点をもう一度クリック
    → 自分自身には接続しない
  */

  if(
    connectingPointId ===
    point.id
  ){

    return;

  }


  const previousPoint =
    findPoint(
      connectingPointId
    );


  if(!previousPoint){

    connectingPointId =
      point.id;

    updateConnectionDisplay();

    render();

    return;

  }


  /*
    線を作成
  */

  createConnection(
    previousPoint,
    point,
    route.id
  );


  /*
    駅なら路線駅一覧へ登録
  */

  if(
    stations.some(
      s => s.id === point.id
    )
  ){

    addStationToRoute(
      route,
      point.id
    );

  }


  /*
    今クリックした点を
    次の始点にする
  */

  connectingPointId =
    point.id;

  selectedPointId =
    point.id;

  updateConnectionDisplay();

  render();

}


/* =========================================================
   CREATE CONNECTION
========================================================= */

function createConnection(
  pointA,
  pointB,
  routeId
){

  if(!pointA || !pointB){
    return;
  }

  if(
    pointA.id ===
    pointB.id
  ){

    return;

  }

  const route =
    findRoute(
      routeId
    );

  if(!route){
    return;
  }


  /*
    同じ路線の同じ線を
    重複作成しない
  */

  const exists =
    connections.some(
      connection => {

        if(
          connection.routeId !==
          routeId
        ){

          return false;

        }

        const normal =
          connection.a ===
            pointA.id &&
          connection.b ===
            pointB.id;

        const reverse =
          connection.a ===
            pointB.id &&
          connection.b ===
            pointA.id;

        return (
          normal ||
          reverse
        );

      }
    );


  if(exists){

    return;

  }


  connections.push({

    id:createId(),

    a:pointA.id,

    b:pointB.id,

    routeId:routeId

  });

}


/* =========================================================
   CONNECTION DISPLAY
========================================================= */

function updateConnectionDisplay(){

  const box =
    document.getElementById(
      "connectionDisplay"
    );


  if(
    selectedRouteId === null
  ){

    box.style.display =
      "none";

    return;

  }


  const route =
    findRoute(
      selectedRouteId
    );


  if(!route){

    box.style.display =
      "none";

    return;

  }


  box.style.display =
    "block";


  const code =
    normalizeRouteCode(
      route.code
    ) || "XX";


  if(
    connectingPointId === null
  ){

    box.textContent =
      code +
      "「" +
      route.name +
      "」：最初の点をクリック";

    return;

  }


  const point =
    findPoint(
      connectingPointId
    );


  if(!point){

    return;

  }


  const station =
    findStation(
      point.id
    );


  if(station){

    box.textContent =
      code +
      "「" +
      route.name +
      "」：" +
      (
        getStationCode(
          route,
          station.id
        ) ||
        "駅"
      ) +
      " → 次の点をクリック";

  }else{

    box.textContent =
      code +
      "「" +
      route.name +
      "」：分岐点 → 次の点をクリック";

  }

}


/* =========================================================
   DELETE POINT
========================================================= */

function deletePoint(
  point
){

  stations =
    stations.filter(
      s =>
        s.id !== point.id
    );

  branches =
    branches.filter(
      b =>
        b.id !== point.id
    );

  connections =
    connections.filter(
      c =>
        c.a !== point.id &&
        c.b !== point.id
    );


  routes.forEach(
    route => {

      route.stationOrder =
        ensureRouteStationOrder(
          route
        ).filter(
          id =>
            id !== point.id
        );

    }
  );


  if(
    selectedPointId ===
    point.id
  ){

    selectedPointId =
      null;

  }


  if(
    connectingPointId ===
    point.id
  ){

    connectingPointId =
      null;

  }


  render();

}


/* =========================================================
   DELETE CONNECTION
========================================================= */

function deleteConnection(
  connection
){

  connections =
    connections.filter(
      c =>
        c.id !==
        connection.id
    );

  render();

}


/* =========================================================
   CONNECTION CLICK
========================================================= */

function connectionClicked(
  connection,
  e
){

  L.DomEvent.stopPropagation(
    e
  );


  if(mode === "delete"){

    deleteConnection(
      connection
    );

    return;

  }

}


/* =========================================================
   DRAG POINT
========================================================= */

function movePoint(
  point,
  marker
){

  marker.on(
    "dragend",
    function(){

      if(
        mode !== "move"
      ){

        return;

      }

      const pos =
        marker.getLatLng();

      point.lat =
        pos.lat;

      point.lng =
        pos.lng;

      render();

    }
  );

}


/* =========================================================
   RENDER POINTS
========================================================= */

function renderPoints(){

  pointLayer.clearLayers();


  /* STATIONS */

  stations.forEach(
    station => {

      const marker =
        L.marker(
          [
            station.lat,
            station.lng
          ],
          {
            icon:
              stationIcon(
                selectedPointId ===
                  station.id,
                connectingPointId ===
                  station.id
              ),

            draggable:
              mode === "move"
          }
        );


      if(station.name){

        marker.bindTooltip(
          escapeHTML(
            station.name
          ),
          {
            permanent:true,

            direction:"top",

            offset:[
              0,
              -(
                settings.stationSize /
                2 +
                4
              )
            ],

            className:
              "station-label"
          }
        );

      }


      marker.on(
        "click",
        e =>
          pointClicked(
            station,
            e
          )
      );


      movePoint(
        station,
        marker
      );


      marker.addTo(
        pointLayer
      );

    }
  );


  /* BRANCHES */

  branches.forEach(
    branch => {

      const marker =
        L.marker(
          [
            branch.lat,
            branch.lng
          ],
          {
            icon:
              branchIcon(
                selectedPointId ===
                  branch.id,
                connectingPointId ===
                  branch.id
              ),

            draggable:
              mode === "move"
          }
        );


      marker.on(
        "click",
        e =>
          pointClicked(
            branch,
            e
          )
      );


      movePoint(
        branch,
        marker
      );


      marker.addTo(
        pointLayer
      );

    }
  );

}


/* =========================================================
   RENDER LINES
========================================================= */

function renderLines(){

  lineLayer.clearLayers();


  connections.forEach(
    connection => {

      const pointA =
        findPoint(
          connection.a
        );

      const pointB =
        findPoint(
          connection.b
        );

      if(
        !pointA ||
        !pointB
      ){

        return;

      }


      const route =
        findRoute(
          connection.routeId
        );

      if(!route){

        return;

      }


      const weight =
        Math.max(
          1,
          Number(
            settings.globalWidth
          ) || 6
        );


      const line =
        L.polyline(
          [
            [
              pointA.lat,
              pointA.lng
            ],
            [
              pointB.lat,
              pointB.lng
            ]
          ],
          {
            color:
              route.color ||
              "#ff0000",

            weight:weight,

            opacity:1,

            lineCap:"round",

            lineJoin:"round"
          }
        );


      line.on(
        "click",
        e =>
          connectionClicked(
            connection,
            e
          )
      );


      line.addTo(
        lineLayer
      );

    }
  );


  renderRouteLabels();

}


/* =========================================================
   ROUTE LABELS
========================================================= */

function renderRouteLabels(){

  routes.forEach(
    route => {

      const routeConnections =
        getRouteConnections(
          route.id
        );


      if(
        routeConnections.length ===
        0
      ){

        return;

      }


      const connection =
        routeConnections[
          Math.floor(
            routeConnections.length / 2
          )
        ];


      const pointA =
        findPoint(
          connection.a
        );

      const pointB =
        findPoint(
          connection.b
        );


      if(
        !pointA ||
        !pointB
      ){

        return;

      }


      const lat =
        (
          pointA.lat +
          pointB.lat
        ) / 2;


      const lng =
        (
          pointA.lng +
          pointB.lng
        ) / 2;


      const label =
        L.marker(
          [
            lat,
            lng
          ],
          {
            interactive:false,

            icon:
              L.divIcon({

                className:"",

                html:
                  '<div style="' +
                  'font-size:' +
                  settings.labelSize +
                  'px;' +
                  'font-weight:900;' +
                  'background:rgba(255,255,255,.92);' +
                  'border:1px solid #aaa;' +
                  'border-radius:4px;' +
                  'padding:2px 5px;' +
                  'white-space:nowrap;' +
                  '">' +
                  escapeHTML(
                    route.name
                  ) +
                  '</div>',

                iconSize:null

              })

          }
        );


      label.addTo(
        lineLayer
      );

    }
  );

}


/* =========================================================
   SELECTED INFO
========================================================= */

function updateSelectedInfo(){

  const box =
    document.getElementById(
      "selectedInfo"
    );


  if(
    selectedPointId === null
  ){

    box.textContent =
      "何も選択されていません";

    return;

  }


  const station =
    findStation(
      selectedPointId
    );


  if(station){

    box.innerHTML =
      '<div style="font-weight:900;margin-bottom:6px">' +
      '駅' +
      '</div>' +

      '<input ' +
      'id="selectedStationName" ' +
      'type="text" ' +
      'value="' +
      escapeAttribute(
        station.name
      ) +
      '" ' +
      'placeholder="駅名を入力">';


    const input =
      document.getElementById(
        "selectedStationName"
      );


    input.addEventListener(
      "input",
      function(){

        station.name =
          this.value;

        renderPoints();

        renderStationList();

      }
    );


    return;

  }


  const branch =
    branches.find(
      b =>
        b.id ===
        selectedPointId
    );


  if(branch){

    box.innerHTML =
      '<b>分岐・方向転換点</b><br>' +
      '<span class="smallText">' +
      'この点は路線の接続に使用できます。' +
      '</span>';

    return;

  }


  box.textContent =
    "何も選択されていません";

}


/* =========================================================
   ADD ROUTE
========================================================= */

document.getElementById(
  "addRoute"
).onclick =
function(){

  const name =
    document.getElementById(
      "routeName"
    ).value.trim();


  let code =
    normalizeRouteCode(
      document.getElementById(
        "routeCode"
      ).value
    );


  if(!code){

    code = "XX";

  }


  const route = {

    id:createId(),

    name:
      name ||
      "新しい路線",

    code:code,

    color:
      document.getElementById(
        "routeColor"
      ).value ||
      "#ff0000",

    width:
      Number(
        document.getElementById(
          "routeWidth"
        ).value
      ) || 6,

    stationOrder:[]

  };


  routes.push(
    route
  );


  selectedRouteId =
    route.id;

  connectingPointId =
    null;

  document.getElementById(
    "routeName"
  ).value = "";

  document.getElementById(
    "routeCode"
  ).value = "";


  updateConnectionDisplay();

  render();

};


/* =========================================================
   ROUTE NAME / CODE / COLOR / WIDTH
========================================================= */

document.getElementById(
  "routeName"
).addEventListener(
  "input",
  function(){

    const route =
      findRoute(
        selectedRouteId
      );

    if(!route){
      return;
    }

    route.name =
      this.value;

    renderLines();

    renderRouteList();

    updateConnectionDisplay();

  }
);


document.getElementById(
  "routeCode"
).addEventListener(

/* =========================================================
   CSS RAIL LOGO HTML
========================================================= */

function railLogoHTML(
  code,
  number,
  sizeClass
){

  const safeCode =
    escapeHTML(
      normalizeRouteCode(
        code
      ) || "XX"
    );


  let safeNumber =
    "";


  if(
    number !== null &&
    number !== undefined &&
    number !== ""
  ){

    safeNumber =
      escapeHTML(
        String(
          number
        ).padStart(
          2,
          "0"
        )
      );

  }


  return (
    '<div class="railLogo ' +
    (
      sizeClass ||
      ""
    ) +
    '">' +

      '<div class="railLogoInner">' +

        '<div class="railLogoCode">' +
          safeCode +
        '</div>' +

        (
          safeNumber
            ?
              '<div class="railLogoNumber">' +
              safeNumber +
              '</div>'
            :
              ""
        ) +

      '</div>' +

    '</div>'
  );

}

  "detailBack"
).onclick =
function(){

  const view =
    document.getElementById(
      "detailView"
    );


  /*
    現在のページを削除
  */

  if(
    detailHistory.length >
    0
  ){

    detailHistory.pop();

  }


  const previous =
    detailHistory[
      detailHistory.length - 1
    ];


  if(previous){

    if(
      previous.type ===
      "route"
    ){

      openRouteDetail(
        previous.id,
        true
      );

      return;

    }


    if(
      previous.type ===
      "station"
    ){

      openStationDetail(
        previous.id,
        true
      );

      return;

    }

  }


  view.classList.remove(
    "show"
  );

  document.getElementById(
    "detailBody"
  ).innerHTML = "";

};


/* =========================================================
   SAVE DATA
========================================================= */

function makeData(){

  const center =
    map.getCenter();


  return {

    version:6,

    nextId:nextId,

    stations:
      stations.map(
        s => ({
          id:s.id,
          name:s.name || "",
          lat:s.lat,
          lng:s.lng
        })
      ),

    branches:
      branches.map(
        b => ({
          id:b.id,
          lat:b.lat,
          lng:b.lng
        })
      ),

    connections:
      connections.map(
        c => ({
          id:c.id,
          a:c.a,
          b:c.b,
          routeId:c.routeId
        })
      ),

    routes:
      routes.map(
        r => ({
          id:r.id,
          name:r.name || "",
          code:
            normalizeRouteCode(
              r.code
            ),
          color:
            r.color ||
            "#ff0000",
          width:
            Number(r.width) ||
            6,
          stationOrder:
            Array.isArray(
              r.stationOrder
            )
              ?
                r.stationOrder.slice()
              :
                []
        })
      ),

    settings:
      Object.assign(
        {},
        settings
      ),

    selectedRouteId:
      selectedRouteId,

    center:{
      lat:center.lat,
      lng:center.lng
    },

    zoom:
      map.getZoom()

  };

}


/* =========================================================
   LOAD DATA
========================================================= */

function loadData(
  data
){

  if(
    !data ||
    typeof data !==
    "object"
  ){

    return;

  }


  stations =
    Array.isArray(
      data.stations
    )
      ?
        data.stations
          .map(
            s => ({
              id:Number(s.id),
              name:
                String(
                  s.name ||
                  ""
                ),
              lat:
                Number(s.lat),
              lng:
                Number(s.lng)
            })
          )
          .filter(
            s =>
              Number.isFinite(
                s.id
              ) &&
              Number.isFinite(
                s.lat
              ) &&
              Number.isFinite(
                s.lng
              )
          )
      :
        [];


  branches =
    Array.isArray(
      data.branches
    )
      ?
        data.branches
          .map(
            b => ({
              id:Number(b.id),
              lat:
                Number(b.lat),
              lng:
                Number(b.lng)
            })
          )
          .filter(
            b =>
              Number.isFinite(
                b.id
              ) &&
              Number.isFinite(
                b.lat
              ) &&
              Number.isFinite(
                b.lng
              )
          )
      :
        [];


  routes =
    Array.isArray(
      data.routes
    )
      ?
        data.routes.map(
          r => ({
            id:Number(r.id),

            name:
              String(
                r.name ||
                "新しい路線"
              ),

            code:
              normalizeRouteCode(
                r.code
              ) ||
              "XX",

            color:
              r.color ||
              "#ff0000",

            width:
              Number(
                r.width
              ) || 6,

            stationOrder:
              Array.isArray(
                r.stationOrder
              )
                ?
                  r.stationOrder
                    .map(
                      Number
                    )
                :
                  []
          })
        )
      :
        [];


  connections =
    Array.isArray(
      data.connections
    )
      ?
        data.connections
          .map(
            c => ({
              id:Number(c.id),
              a:Number(c.a),
              b:Number(c.b),
              routeId:
                Number(
                  c.routeId
                )
            })
          )
          .filter(
            c =>
              Number.isFinite(
                c.id
              ) &&
              Number.isFinite(
                c.a
              ) &&
              Number.isFinite(
                c.b
              ) &&
              Number.isFinite(
                c.routeId
              )
          )
      :
        [];


  if(
    data.settings &&
    typeof data.settings ===
    "object"
  ){

    settings =
      Object.assign(
        {},
        settings,
        data.settings
      );

  }


  /*
    駅番号の整合性を修正
  */

  routes.forEach(
    route => {

      route.stationOrder =
        route.stationOrder.filter(
          id =>
            stations.some(
              s =>
                s.id === id
            )
        );

    }
  );


  /*
    nextIdを安全に再計算
  */

  const allIds =
    stations
      .map(
        x => x.id
      )
      .concat(
        branches.map(
          x => x.id
        )
      )
      .concat(
        routes.map(
          x => x.id
        )
      )
      .concat(
        connections.map(
          x => x.id
        )
      )
      .filter(
        Number.isFinite
      );


  nextId =
    Math.max(
      0,
      ...allIds
    ) + 1;


  if(
    Number.isFinite(
      Number(
        data.nextId
      )
    )
  ){

    nextId =
      Math.max(
        nextId,
        Number(
          data.nextId
        )
      );

  }


  selectedRouteId =
    routes.some(
      r =>
        r.id ===
        Number(
          data.selectedRouteId
        )
    )
      ?
        Number(
          data.selectedRouteId
        )
      :
        null;


  selectedPointId =
    null;

  connectingPointId =
    null;


  if(data.center){

    const lat =
      Number(
        data.center.lat
      );

    const lng =
      Number(
        data.center.lng
      );

    const zoom =
      Number(
        data.zoom
      );


    if(
      Number.isFinite(lat) &&
      Number.isFinite(lng)
    ){

      map.setView(
        [
          lat,
          lng
        ],
        Number.isFinite(zoom)
          ? zoom
          : 13
      );

    }

  }


  /*
    設定UIへ反映
  */

  document.getElementById(
    "globalWidth"
  ).value =
    settings.globalWidth;

  document.getElementById(
    "stationSize"
  ).value =
    settings.stationSize;

  document.getElementById(
    "branchSize"
  ).value =
    settings.branchSize;

  document.getElementById(
    "labelSize"
  ).value =
    settings.labelSize;


  updateConnectionDisplay();

  render();

}

    */

  }

};


/* =========================================================
   EXPORT
========================================================= */

document.getElementById(
  "exportData"
).onclick =
function(){

  const data =
    JSON.stringify(
      makeData(),
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    "fictional-route-map.json";


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  URL.revokeObjectURL(
    url
  );

};


/* =========================================================
   IMPORT
========================================================= */

document.getElementById(
  "importData"
).onclick =
function(){

  document.getElementById(
    "fileInput"
  ).click();

};


document.getElementById(
  "fileInput"
).addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(){

        try{

          loadData(
            JSON.parse(
              reader.result
            )
          );

        }catch(error){

        }

      };


    reader.readAsText(
      file
    );


    this.value = "";

  }
);
