<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>架空路線マップメーカー</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}

/* =========================
   上部
========================= */

#topbar{
  height:58px;
  min-height:58px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  overflow-x:auto;
  z-index:5000;
}

#title{
  font-size:17px;
  font-weight:bold;
  white-space:nowrap;
  margin-right:10px;
}

.toolButton{
  border:1px solid #777;
  background:white;
  color:#111;
  border-radius:5px;
  padding:8px 12px;
  cursor:pointer;
  white-space:nowrap;
  font-size:13px;
}

.toolButton:hover{
  background:#eee;
}

.toolButton.active{
  background:#ff8800;
  border-color:#ff8800;
  color:white;
}

/* =========================
   メイン
========================= */

#main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

#sidebar{
  width:290px;
  min-width:290px;
  background:#f2f2f2;
  border-right:1px solid #aaa;
  overflow-y:auto;
  padding:10px;
  z-index:4000;
}

.section{
  background:white;
  border:1px solid #ccc;
  border-radius:7px;
  padding:10px;
  margin-bottom:10px;
}

.sectionTitle{
  font-weight:bold;
  font-size:15px;
  margin-bottom:8px;
}

.row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
}

.row label{
  flex:1;
  font-size:13px;
}

input[type="text"]{
  width:100%;
  border:1px solid #aaa;
  border-radius:4px;
  padding:7px;
  font-size:14px;
}

input[type="number"]{
  width:75px;
  border:1px solid #aaa;
  border-radius:4px;
  padding:6px;
}

input[type="color"]{
  width:55px;
  height:34px;
  padding:2px;
  border:1px solid #aaa;
}

.actionButton{
  width:100%;
  border:1px solid #999;
  background:white;
  border-radius:5px;
  padding:8px;
  cursor:pointer;
}

.actionButton:hover{
  background:#eee;
}

/* =========================
   路線一覧
========================= */

#routeList{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.routeItem{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px;
  border:1px solid #ccc;
  border-radius:5px;
  background:#fafafa;
}

.routeItem.selected{
  border:2px solid #ff8800;
}

.routeColor{
  width:20px;
  height:20px;
  border-radius:50%;
  border:1px solid #555;
  flex:none;
}

.routeName{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.routeSelect{
  padding:5px 7px;
  border:1px solid #999;
  border-radius:4px;
  background:white;
  cursor:pointer;
}

/* =========================
   地図
========================= */

#map{
  flex:1;
  min-width:0;
  min-height:0;
  position:relative;
}

#modeDisplay{
  position:absolute;
  left:10px;
  top:10px;
  z-index:2000;
  background:white;
  border:1px solid #888;
  border-radius:5px;
  padding:7px 10px;
  font-size:13px;
  box-shadow:0 1px 5px rgba(0,0,0,.35);
}

#north{
  position:absolute;
  right:12px;
  top:12px;
  z-index:2000;
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  border:1px solid #888;
  box-shadow:0 1px 5px rgba(0,0,0,.3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:20px;
}

/* =========================
   駅・点
========================= */

.station-marker{
  background:white;
  border:3px solid #111;
  border-radius:50%;
}

.branch-marker{
  background:#111;
  border:2px solid white;
  border-radius:50%;
}

.station-label{
  background:white;
  border:1px solid #999;
  border-radius:3px;
  box-shadow:none;
  color:#111;
  font-weight:bold;
  padding:2px 4px;
  white-space:nowrap;
}

/* =========================
   接続中
========================= */

.connecting{
  animation:blink .7s infinite alternate;
}

@keyframes blink{
  from{
    filter:brightness(1);
  }
  to{
    filter:brightness(1.8);
  }
}

/* =========================
   スマホ
========================= */

#menuButton{
  display:none;
  position:absolute;
  bottom:10px;
  left:10px;
  z-index:5000;
  border:1px solid #777;
  background:white;
  border-radius:5px;
  padding:9px 12px;
}

@media(max-width:800px){

  #sidebar{
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    transform:translateX(-100%);
    transition:transform .2s;
    box-shadow:2px 0 8px rgba(0,0,0,.4);
  }

  #sidebar.open{
    transform:translateX(0);
  }

  #menuButton{
    display:block;
  }

  #title{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="topbar">

  <div id="title">
    架空路線マップメーカー
  </div>

  <button class="toolButton active" id="selectMode">
    選択
  </button>

  <button class="toolButton" id="moveMode">
    移動
  </button>

  <button class="toolButton" id="stationMode">
    駅を追加
  </button>

  <button class="toolButton" id="branchMode">
    分岐・方向転換点
  </button>

  <button class="toolButton" id="connectMode">
    接続
  </button>

  <button class="toolButton" id="deleteMode">
    点・線を削除
  </button>

</div>


<div id="main">

  <aside id="sidebar">

    <!-- 路線設定 -->

    <div class="section">

      <div class="sectionTitle">
        路線
      </div>

      <input
        id="routeName"
        type="text"
        placeholder="路線名"
      >

      <div class="row">
        <label>路線色</label>
        <input
          id="routeColor"
          type="color"
          value="#ff0000"
        >
      </div>

      <div class="row">
        <label>線の太さ</label>
        <input
          id="routeWidth"
          type="number"
          min="1"
          max="30"
          value="6"
        >
      </div>

      <button
        class="actionButton"
        id="addRoute"
      >
        路線を追加
      </button>

    </div>


    <!-- 全体設定 -->

    <div class="section">

      <div class="sectionTitle">
        全体表示設定
      </div>

      <div class="row">
        <label>線の太さ</label>
        <input
          id="globalWidth"
          type="number"
          min="1"
          max="30"
          value="6"
        >
      </div>

      <div class="row">
        <label>駅の大きさ</label>
        <input
          id="globalStationSize"
          type="number"
          min="4"
          max="40"
          value="12"
        >
      </div>

      <div class="row">
        <label>分岐点の大きさ</label>
        <input
          id="globalBranchSize"
          type="number"
          min="3"
          max="30"
          value="7"
        >
      </div>

      <div class="row">
        <label>駅名の大きさ</label>
        <input
          id="globalLabelSize"
          type="number"
          min="8"
          max="40"
          value="14"
        >
      </div>

      <button
        class="actionButton"
        id="applySettings"
      >
        全体設定を適用
      </button>

    </div>


    <!-- 路線一覧 -->

    <div class="section">

      <div class="sectionTitle">
        路線一覧
      </div>

      <div id="routeList"></div>

    </div>


    <!-- 保存 -->

    <div class="section">

      <div class="sectionTitle">
        データ
      </div>

      <div class="row">

        <button
          class="actionButton"
          id="saveData"
        >
          保存
        </button>

        <button
          class="actionButton"
          id="loadData"
        >
          読込
        </button>

      </div>

      <div class="row">

        <button
          class="actionButton"
          id="exportData"
        >
          JSON出力
        </button>

        <button
          class="actionButton"
          id="importData"
        >
          JSON読込
        </button>

      </div>

      <input
        type="file"
        id="fileInput"
        accept=".json,application/json"
        style="display:none"
      >

    </div>


    <!-- 操作説明 -->

    <div class="section">

      <div class="sectionTitle">
        操作
      </div>

      <div style="font-size:12px;line-height:1.8">

        <b>選択</b><br>
        駅・分岐点・線をクリックして選択します。

        <br><br>

        <b>移動</b><br>
        駅や分岐・方向転換点をドラッグします。
        接続されている線も自動的に追従します。

        <br><br>

        <b>駅を追加</b><br>
        地図をクリックして駅を配置します。

        <br><br>

        <b>分岐・方向転換点</b><br>
        駅ではない点を配置します。

        <br><br>

        <b>接続</b><br>
        1つ目の点、2つ目の点の順番にクリックすると線ができます。

        <br><br>

        <b>点・線を削除</b><br>
        駅、分岐点、線をクリックして削除します。

        <br><br>

        <b>重要</b><br>
        駅や分岐点を置いただけでは線は引かれません。
        「接続」を使った場合のみ線が作られます。

      </div>

    </div>

  </aside>


  <div id="map">

    <div id="modeDisplay">
      モード：選択
    </div>

    <div id="north">
      N
    </div>

  </div>

  <button id="menuButton">
    メニュー
  </button>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin="">
</script>


<script>

(function(){

"use strict";


/* =========================================================
   地図
========================================================= */

const map=L.map("map",{
  zoomControl:true,
  attributionControl:true
});

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);

map.setView(
  [35.681236,139.767125],
  13
);


/* =========================================================
   レイヤー
========================================================= */

const lineLayer=L.layerGroup().addTo(map);
const pointLayer=L.layerGroup().addTo(map);


/* =========================================================
   データ
========================================================= */

let stations=[];
let branches=[];
let connections=[];
let routes=[];

let nextId=1;

let selectedRouteId=null;

let mode="select";

let firstConnectionPoint=null;


/* =========================================================
   設定
========================================================= */

let settings={
  globalWidth:6,
  stationSize:12,
  branchSize:7,
  labelSize:14
};


/* =========================================================
   ID
========================================================= */

function createId(){

  return nextId++;
}


/* =========================================================
   全点取得
========================================================= */

function allPoints(){

  return stations.concat(branches);
}


/* =========================================================
   点検索
========================================================= */

function findPoint(pointId){

  return allPoints().find(
    p=>p.id===pointId
  ) || null;
}


/* =========================================================
   モード
========================================================= */

const modeButtons={
  select:document.getElementById("selectMode"),
  move:document.getElementById("moveMode"),
  station:document.getElementById("stationMode"),
  branch:document.getElementById("branchMode"),
  connect:document.getElementById("connectMode"),
  delete:document.getElementById("deleteMode")
};

function setMode(newMode){

  mode=newMode;

  firstConnectionPoint=null;

  Object.values(modeButtons).forEach(
    button=>button.classList.remove("active")
  );

  modeButtons[newMode].classList.add("active");

  const names={
    select:"選択",
    move:"移動",
    station:"駅を追加",
    branch:"分岐・方向転換点",
    connect:"接続",
    delete:"点・線を削除"
  };

  document.getElementById("modeDisplay").textContent=
    "モード："+names[newMode];

  render();
}

modeButtons.select.onclick=()=>{
  setMode("select");
};

modeButtons.move.onclick=()=>{
  setMode("move");
};

modeButtons.station.onclick=()=>{
  setMode("station");
};

modeButtons.branch.onclick=()=>{
  setMode("branch");
};

modeButtons.connect.onclick=()=>{
  setMode("connect");
};

modeButtons.delete.onclick=()=>{
  setMode("delete");
};


/* =========================================================
   地図クリック
========================================================= */

map.on("click",function(e){

  if(mode==="station"){

    addStation(e.latlng);
    return;
  }

  if(mode==="branch"){

    addBranch(e.latlng);
    return;
  }

});


/* =========================================================
   駅追加
========================================================= */

function addStation(latlng){

  const name=prompt("駅名を入力してください。");

  if(name===null){
    return;
  }

  const station={
    id:createId(),
    name:name.trim() || "駅",
    lat:latlng.lat,
    lng:latlng.lng
  };

  stations.push(station);

  render();
}


/* =========================================================
   分岐・方向転換点追加
========================================================= */

function addBranch(latlng){

  const branch={
    id:createId(),
    lat:latlng.lat,
    lng:latlng.lng
  };

  branches.push(branch);

  render();
}


/* =========================================================
   点クリック
========================================================= */

function pointClicked(point,e){

  L.DomEvent.stopPropagation(e);


  /* 接続 */

  if(mode==="connect"){

    if(!firstConnectionPoint){

      firstConnectionPoint=point;

      render();

      return;
    }


    if(firstConnectionPoint.id===point.id){

      firstConnectionPoint=null;

      render();

      return;
    }


    createConnection(
      firstConnectionPoint,
      point
    );

    firstConnectionPoint=null;

    render();

    return;
  }


  /* 削除 */

  if(mode==="delete"){

    deletePoint(point);

    return;
  }

}


/* =========================================================
   接続作成
========================================================= */

function createConnection(pointA,pointB){

  const alreadyExists=connections.some(
    c=>
      (
        c.a===pointA.id &&
        c.b===pointB.id
      ) ||
      (
        c.a===pointB.id &&
        c.b===pointA.id
      )
  );

  if(alreadyExists){
    return;
  }


  let routeId=selectedRouteId;

  if(!routeId && routes.length>0){

    routeId=routes[0].id;
    selectedRouteId=routeId;
  }


  if(!routeId){

    alert("先に路線を追加してください。");

    return;
  }


  connections.push({

    id:createId(),

    a:pointA.id,

    b:pointB.id,

    routeId:routeId

  });

}


/* =========================================================
   点削除
========================================================= */

function deletePoint(point){

  stations=stations.filter(
    s=>s.id!==point.id
  );

  branches=branches.filter(
    p=>p.id!==point.id
  );

  connections=connections.filter(
    c=>
      c.a!==point.id &&
      c.b!==point.id
  );

  render();
}


/* =========================================================
   線クリック
========================================================= */

function connectionClicked(connection,e){

  L.DomEvent.stopPropagation(e);

  if(mode!=="delete"){
    return;
  }

  connections=connections.filter(
    c=>c.id!==connection.id
  );

  render();
}


/* =========================================================
   マーカーサイズ
========================================================= */

function stationIcon(){

  const size=settings.stationSize;

  return L.divIcon({

    className:"",

    html:
      '<div class="station-marker" '+
      'style="' +
      'width:'+size+'px;' +
      'height:'+size+'px;' +
      '"></div>',

    iconSize:[size,size],

    iconAnchor:[
      size/2,
      size/2
    ]

  });
}


function branchIcon(isSelected){

  const size=settings.branchSize;

  return L.divIcon({

    className:"",

    html:
      '<div class="branch-marker '+
      (isSelected?"connecting":"")+
      '" style="' +
      'width:'+size+'px;' +
      'height:'+size+'px;' +
      '"></div>',

    iconSize:[size,size],

    iconAnchor:[
      size/2,
      size/2
    ]

  });
}


/* =========================================================
   駅・点描画
========================================================= */

function renderPoints(){

  pointLayer.clearLayers();


  /* 駅 */

  stations.forEach(station=>{

    const marker=L.marker(
      [station.lat,station.lng],
      {
        icon:stationIcon(),
        draggable:mode==="move"
      }
    );


    marker.bindTooltip(
      escapeHTML(station.name),
      {
        permanent:true,
        direction:"top",
        offset:[
          0,
          -(settings.stationSize/2)-4
        ],
        className:"station-label"
      }
    );


    marker.on(
      "click",
      e=>pointClicked(station,e)
    );


    marker.on(
      "dragend",
      e=>{

        if(mode!=="move"){
          return;
        }

        const pos=e.target.getLatLng();

        station.lat=pos.lat;
        station.lng=pos.lng;

        renderLines();

      }
    );


    marker.addTo(pointLayer);

  });


  /* 分岐・方向転換点 */

  branches.forEach(branch=>{

    const marker=L.marker(
      [branch.lat,branch.lng],
      {
        icon:branchIcon(
          firstConnectionPoint &&
          firstConnectionPoint.id===branch.id
        ),
        draggable:mode==="move"
      }
    );


    marker.on(
      "click",
      e=>pointClicked(branch,e)
    );


    marker.on(
      "dragend",
      e=>{

        if(mode!=="move"){
          return;
        }

        const pos=e.target.getLatLng();

        branch.lat=pos.lat;
        branch.lng=pos.lng;

        renderLines();

      }
    );


    marker.addTo(pointLayer);

  });

}


/* =========================================================
   線描画
========================================================= */

function renderLines(){

  lineLayer.clearLayers();


  connections.forEach(connection=>{

    const a=findPoint(connection.a);
    const b=findPoint(connection.b);

    if(!a || !b){
      return;
    }


    const route=routes.find(
      r=>r.id===connection.routeId
    );


    if(!route){
      return;
    }


    const line=L.polyline(

      [
        [a.lat,a.lng],
        [b.lat,b.lng]
      ],

      {
        color:route.color,

        weight:settings.globalWidth,

        opacity:1,

        lineCap:"round",

        lineJoin:"round",

        interactive:true
      }

    );


    line.on(
      "click",
      e=>connectionClicked(
        connection,
        e
      )
    );


    line.addTo(lineLayer);

  });


  renderRouteLabels();

}


/* =========================================================
   路線名
========================================================= */

function renderRouteLabels(){

  routes.forEach(route=>{

    const routeConnections=
      connections.filter(
        c=>c.routeId===route.id
      );


    if(routeConnections.length===0){
      return;
    }


    const c=
      routeConnections[
        Math.floor(
          routeConnections.length/2
        )
      ];


    const a=findPoint(c.a);
    const b=findPoint(c.b);


    if(!a || !b){
      return;
    }


    const lat=
      (a.lat+b.lat)/2;

    const lng=
      (a.lng+b.lng)/2;


    const label=L.marker(
      [lat,lng],
      {
        interactive:false,
        icon:L.divIcon({

          className:"",

          html:
            '<div style="' +
            'font-size:13px;' +
            'font-weight:bold;' +
            'background:rgba(255,255,255,.85);' +
            'padding:2px 5px;' +
            'border-radius:3px;' +
            'white-space:nowrap;' +
            '">' +
            escapeHTML(route.name) +
            '</div>',

          iconSize:null

        })
      }
    );


    label.addTo(lineLayer);

  });

}


/* =========================================================
   描画
========================================================= */

function render(){

  renderLines();

  renderPoints();

  renderRouteList();

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   路線追加
========================================================= */

document.getElementById(
  "addRoute"
).onclick=function(){

  const name=
    document.getElementById(
      "routeName"
    ).value.trim();


  if(!name){

    alert("路線名を入力してください。");

    return;
  }


  const route={

    id:createId(),

    name:name,

    color:
      document.getElementById(
        "routeColor"
      ).value,

    width:
      Number(
        document.getElementById(
          "routeWidth"
        ).value
      ) || 6

  };


  routes.push(route);

  selectedRouteId=route.id;


  document.getElementById(
    "routeName"
  ).value="";


  render();

};


/* =========================================================
   路線一覧
========================================================= */

function renderRouteList(){

  const list=
    document.getElementById(
      "routeList"
    );

  list.innerHTML="";


  routes.forEach(route=>{

    const item=
      document.createElement("div");

    item.className=
      "routeItem"+
      (
        selectedRouteId===route.id
          ?" selected"
          :""
      );


    const color=
      document.createElement("div");

    color.className=
      "routeColor";

    color.style.background=
      route.color;


    const name=
      document.createElement("div");

    name.className=
      "routeName";

    name.textContent=
      route.name;


    const button=
      document.createElement("button");

    button.className=
      "routeSelect";

    button.textContent=
      "選択";


    button.onclick=function(){

      selectedRouteId=
        route.id;

      document.getElementById(
        "routeName"
      ).value=route.name;

      document.getElementById(
        "routeColor"
      ).value=route.color;

      document.getElementById(
        "routeWidth"
      ).value=route.width;

      render();

    };


    item.appendChild(color);
    item.appendChild(name);
    item.appendChild(button);

    list.appendChild(item);

  });

}


/* =========================================================
   路線設定
========================================================= */

document.getElementById(
  "routeName"
).addEventListener(
  "input",
  function(){

    const route=
      routes.find(
        r=>r.id===selectedRouteId
      );

    if(!route){
      return;
    }

    route.name=this.value;

    render();

  }
);


document.getElementById(
  "routeColor"
).addEventListener(
  "input",
  function(){

    const route=
      routes.find(
        r=>r.id===selectedRouteId
      );

    if(!route){
      return;
    }

    route.color=this.value;

    render();

  }
);


document.getElementById(
  "routeWidth"
).addEventListener(
  "input",
  function(){

    const route=
      routes.find(
        r=>r.id===selectedRouteId
      );

    if(!route){
      return;
    }

    route.width=
      Number(this.value)||6;

    render();

  }
);


/* =========================================================
   全体設定
========================================================= */

document.getElementById(
  "applySettings"
).onclick=function(){

  settings.globalWidth=
    Number(
      document.getElementById(
        "globalWidth"
      ).value
    ) || 6;


  settings.stationSize=
    Number(
      document.getElementById(
        "globalStationSize"
      ).value
    ) || 12;


  settings.branchSize=
    Number(
      document.getElementById(
        "globalBranchSize"
      ).value
    ) || 7;


  settings.labelSize=
    Number(
      document.getElementById(
        "globalLabelSize"
      ).value
    ) || 14;


  render();

/* =========================================================
   保存データ作成
========================================================= */

function makeData(){

  const center=map.getCenter();


  return {

    version:2,

    stations:
      stations.map(
        s=>({
          id:s.id,
          name:s.name,
          lat:s.lat,
          lng:s.lng
        })
      ),

    branches:
      branches.map(
        p=>({
          id:p.id,
          lat:p.lat,
          lng:p.lng
        })
      ),

    connections:
      connections.map(
        c=>({
          id:c.id,
          a:c.a,
          b:c.b,
          routeId:c.routeId
        })
      ),

    routes:
      routes.map(
        r=>({
          id:r.id,
          name:r.name,
          color:r.color,
          width:r.width
        })
      ),

    settings:Object.assign(
      {},
      settings
    ),

    selectedRouteId:
      selectedRouteId,

    center:{
      lat:center.lat,
      lng:center.lng
    },

    zoom:map.getZoom()

  };

}


/* =========================================================
   保存
========================================================= */

document.getElementById(
  "saveData"
).onclick=function(){

  localStorage.setItem(
    "fictionalRouteMap",
    JSON.stringify(
      makeData()
    )
  );

  alert("保存しました。");

};


/* =========================================================
   読込
========================================================= */

document.getElementById(
  "loadData"
).onclick=function(){

  const raw=
    localStorage.getItem(
      "fictionalRouteMap"
    );


  if(!raw){

    alert(
      "保存データがありません。"
    );

    return;
  }


  try{

    loadData(
      JSON.parse(raw)
    );

    alert(
      "読み込みました。"
    );

  }catch(e){

    alert(
      "保存データを読み込めませんでした。"
    );

  }

};


/* =========================================================
   データ読み込み
========================================================= */

function loadData(data){

  stations=
    Array.isArray(data.stations)
      ?data.stations.map(
        s=>({
          id:s.id,
          name:s.name,
          lat:Number(s.lat),
          lng:Number(s.lng)
        })
      )
      :[];


  branches=
    Array.isArray(data.branches)
      ?data.branches.map(
        p=>({
          id:p.id,
          lat:Number(p.lat),
          lng:Number(p.lng)
        })
      )
      :[];


  routes=
    Array.isArray(data.routes)
      ?data.routes.map(
        r=>({
          id:r.id,
          name:r.name,
          color:r.color,
          width:Number(r.width)||6
        })
      )
      :[];


  connections=
    Array.isArray(data.connections)
      ?data.connections.map(
        c=>({
          id:c.id,
          a:c.a,
          b:c.b,
          routeId:c.routeId
        })
      )
      :[];


  if(data.settings){

    settings=Object.assign(
      settings,
      data.settings
    );

  }


  selectedRouteId=
    data.selectedRouteId || null;


  const ids=
    stations
      .concat(branches)
      .concat(routes)
      .concat(connections)
      .map(x=>Number(x.id))
      .filter(Number.isFinite);


  nextId=
    ids.length
      ?Math.max.apply(null,ids)+1
      :1;


  document.getElementById(
    "globalWidth"
  ).value=
    settings.globalWidth;


  document.getElementById(
    "globalStationSize"
  ).value=
    settings.stationSize;


  document.getElementById(
    "globalBranchSize"
  ).value=
    settings.branchSize;


  document.getElementById(
    "globalLabelSize"
  ).value=
    settings.labelSize;


  if(data.center){

    map.setView(
      [
        data.center.lat,
        data.center.lng
      ],
      data.zoom || 13
    );

  }


  render();

}


/* =========================================================
   JSON出力
========================================================= */

document.getElementById(
  "exportData"
).onclick=function(){

  const json=
    JSON.stringify(
      makeData(),
      null,
      2
    );


  const blob=
    new Blob(
      [json],
      {
        type:"application/json"
      }
    );


  const url=
    URL.createObjectURL(blob);


  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "fictional-route-map.json";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

};


/* =========================================================
   JSON読込
========================================================= */

document.getElementById(
  "importData"
).onclick=function(){

  document.getElementById(
    "fileInput"
  ).click();

};


document.getElementById(
  "fileInput"
).addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file){
      return;
    }


    const reader=
      new FileReader();


    reader.onload=function(){

      try{

        loadData(
          JSON.parse(
            reader.result
          )
        );

        alert(
          "JSONを読み込みました。"
        );

      }catch(e){

        alert(
          "JSONファイルが正しくありません。"
        );

      }

    };


    reader.readAsText(file);

    this.value="";

  }
);


/* =========================================================
   モバイルメニュー
========================================================= */

document.getElementById(
  "menuButton"
).onclick=function(){

  document.getElementById(
    "sidebar"
  ).classList.toggle("open");

};


/* =========================================================
   初期化
========================================================= */

render();

})();

</script>
