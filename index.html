<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>架空路線マップメーカー</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
 color:#222;
 background:#f3f4f6;
}

button,input{
 font:inherit;
}

button{
 cursor:pointer;
}

#app{
 width:100%;
 height:100%;
 display:flex;
}

/* =========================
   サイドバー
========================= */

#sidebar{
 width:330px;
 min-width:330px;
 height:100%;
 background:#fff;
 border-right:1px solid #d9dde3;
 display:flex;
 flex-direction:column;
 z-index:2000;
}

#header{
 height:64px;
 min-height:64px;
 padding:0 16px;
 display:flex;
 align-items:center;
 border-bottom:1px solid #e4e6e9;
 font-size:19px;
 font-weight:800;
}

#menu{
 display:flex;
 gap:6px;
 padding:8px;
 border-bottom:1px solid #e4e6e9;
}

.menuButton{
 flex:1;
 height:42px;
 border:1px solid #d4d8de;
 background:#fff;
 border-radius:8px;
 font-size:13px;
 font-weight:700;
 white-space:nowrap;
}

.menuButton.active{
 background:#222;
 color:#fff;
 border-color:#222;
}

.panel{
 display:none;
 flex:1;
 overflow:auto;
}

.panel.active{
 display:block;
}

.panelInner{
 padding:14px;
}

.title{
 font-size:16px;
 font-weight:800;
 margin-bottom:12px;
}

.description{
 background:#f4f5f7;
 border-radius:8px;
 padding:10px;
 margin-bottom:13px;
 font-size:12px;
 line-height:1.65;
 color:#555;
}

label{
 display:block;
 font-size:12px;
 font-weight:800;
 color:#555;
 margin-bottom:5px;
}

.formGroup{
 margin-bottom:12px;
}

input[type="text"],
input[type="number"]{
 width:100%;
 height:40px;
 border:1px solid #cfd4db;
 border-radius:8px;
 padding:0 10px;
 outline:none;
 background:#fff;
}

input:focus{
 border-color:#555;
}

input[type="color"]{
 width:100%;
 height:40px;
 padding:3px;
 border:1px solid #cfd4db;
 border-radius:8px;
 background:#fff;
}

button.full{
 width:100%;
 height:41px;
 border-radius:8px;
 border:1px solid #cfd4db;
 background:#fff;
 font-weight:700;
}

button.full.primary{
 background:#222;
 color:#fff;
 border-color:#222;
}

button.full.danger{
 color:#a0001b;
 border-color:#ddb2ba;
}

.spacer{
 height:8px;
}

hr{
 border:0;
 border-top:1px solid #e4e6e9;
 margin:18px 0;
}

.rangeRow{
 display:flex;
 align-items:center;
 gap:10px;
}

.rangeRow input{
 flex:1;
}

.rangeValue{
 width:45px;
 text-align:right;
 font-size:12px;
 font-weight:800;
}

/* =========================
   リスト
========================= */

.list{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.empty{
 text-align:center;
 color:#777;
 font-size:13px;
 padding:22px 10px;
}

.listItem{
 width:100%;
 min-height:58px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px;
 border:1px solid #dfe2e6;
 background:#fff;
 border-radius:9px;
 text-align:left;
}

.listItem:hover{
 background:#f6f7f8;
}

.listIcon{
 width:40px;
 min-width:40px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.listMain{
 min-width:0;
 flex:1;
}

.listName{
 font-size:14px;
 font-weight:800;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.listSub{
 margin-top:3px;
 font-size:11px;
 color:#777;
}

/* 路線アイコン */

.routeIcon{
 width:38px;
 height:38px;
 border-radius:9px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 color:#fff;
 font-size:12px;
 font-weight:900;
 border:2px solid #fff;
 box-shadow:0 0 0 1px rgba(0,0,0,.25);
}

.routeIcon:before{
 content:"";
 position:absolute;
 inset:5px;
 border:2px solid rgba(255,255,255,.95);
 border-radius:4px;
}

.routeIcon span{
 position:relative;
 z-index:2;
}

/* 駅アイコン */

.stationIcon{
 width:18px;
 height:18px;
 border:3px solid #222;
 border-radius:50%;
 background:#fff;
}

/* =========================
   地図
========================= */

#mapArea{
 position:relative;
 flex:1;
 min-width:0;
 height:100%;
}

#map{
 width:100%;
 height:100%;
}

/* ツールバー */

#toolbar{
 position:absolute;
 top:12px;
 left:12px;
 z-index:1200;
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 max-width:calc(100% - 24px);
}

.tool{
 min-height:42px;
 padding:0 13px;
 border:1px solid #cfd3d9;
 border-radius:9px;
 background:#fff;
 box-shadow:0 2px 8px rgba(0,0,0,.14);
 font-size:13px;
 font-weight:800;
}

.tool.active{
 background:#222;
 color:#fff;
 border-color:#222;
}

.tool.delete{
 color:#a0001b;
}

.tool.delete.active{
 background:#a0001b;
 color:#fff;
}

/* ステータス */

#status{
 position:absolute;
 left:12px;
 bottom:16px;
 z-index:1200;
 max-width:calc(100% - 24px);
 padding:9px 12px;
 background:rgba(255,255,255,.96);
 border:1px solid #d8dce1;
 border-radius:8px;
 box-shadow:0 2px 8px rgba(0,0,0,.12);
 font-size:12px;
}

/* =========================
   ノード
========================= */

.nodeContainer{
 display:flex;
 align-items:center;
 gap:5px;
 white-space:nowrap;
}

.nodeDot{
 width:var(--nodeSize);
 height:var(--nodeSize);
 border-radius:50%;
 background:#fff;
 border:3px solid #222;
 box-shadow:0 1px 4px rgba(0,0,0,.3);
}

.nodeDot.branch{
 background:#eee;
 border-color:#555;
}

.nodeLabel{
 background:rgba(255,255,255,.96);
 border:1px solid rgba(0,0,0,.2);
 border-radius:5px;
 padding:2px 5px;
 font-size:12px;
 font-weight:800;
 box-shadow:0 1px 4px rgba(0,0,0,.15);
 pointer-events:none;
}

/* =========================
   詳細
========================= */

.back{
 width:100%;
 height:38px;
 border:1px solid #d1d5da;
 border-radius:8px;
 background:#fff;
 font-weight:700;
 margin-bottom:14px;
}

.detailHeader{
 display:flex;
 align-items:center;
 gap:12px;
 margin-bottom:18px;
}

.detailRouteIcon{
 width:68px;
 height:68px;
 min-width:68px;
 border-radius:13px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#fff;
 font-size:20px;
 font-weight:900;
 border:3px solid #fff;
 box-shadow:0 0 0 1px rgba(0,0,0,.25);
}

.detailRouteIcon:before{
 content:"";
 position:absolute;
 inset:7px;
 border:3px solid rgba(255,255,255,.95);
 border-radius:5px;
}

.detailRouteIcon span{
 position:relative;
 z-index:2;
}

.detailTitle{
 min-width:0;
}

.detailTitle h2{
 margin:0;
 font-size:20px;
}

.detailTitle p{
 margin:5px 0 0;
 color:#777;
 font-size:12px;
}

.stationRow{
 min-height:52px;
 display:flex;
 align-items:center;
 gap:10px;
 border-bottom:1px solid #e6e8eb;
 cursor:pointer;
 padding:7px 4px;
}

.stationRow:hover{
 background:#f6f7f8;
}

.stationNumber{
 width:30px;
 height:30px;
 border-radius:50%;
 background:#222;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 flex:none;
 font-size:12px;
 font-weight:800;
}

.stationRowName{
 font-size:14px;
 font-weight:700;
}

.stationRowType{
 margin-left:auto;
 color:#888;
 font-size:10px;
}

.inline{
 display:flex;
 gap:7px;
}

.inline>*{
 flex:1;
}

/* =========================
   モバイル
========================= */

#mobileMenu{
 display:none;
 position:absolute;
 top:10px;
 right:10px;
 z-index:1500;
 width:44px;
 height:44px;
 border:1px solid #ccc;
 border-radius:9px;
 background:#fff;
 box-shadow:0 2px 8px rgba(0,0,0,.15);
 font-size:20px;
 font-weight:900;
}

@media(max-width:800px){

 #sidebar{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  transform:translateX(-100%);
  transition:transform .2s ease;
  box-shadow:3px 0 15px rgba(0,0,0,.2);
 }

 #sidebar.open{
  transform:translateX(0);
 }

 #mobileMenu{
  display:flex;
  align-items:center;
  justify-content:center;
 }

 #toolbar{
  right:10px;
 }

 .tool{
  min-height:39px;
  padding:0 9px;
  font-size:12px;
 }
}
</style>
</head>

<body>

<div id="app">

<aside id="sidebar">

 <div id="header">
  架空路線マップメーカー
 </div>

 <div id="menu">

  <button class="menuButton active" data-panel="mapPanel">
   マップ
  </button>

  <button class="menuButton" data-panel="routesPanel">
   路線一覧
  </button>

  <button class="menuButton" data-panel="stationsPanel">
   駅一覧
  </button>

 </div>

 <!-- マップパネル -->

 <section id="mapPanel" class="panel active">

  <div class="panelInner">

   <div class="title">
    マップ操作
   </div>

   <div class="description">
    駅や分岐点を配置してから、接続モードで点を順番にクリックして路線を作成します。
    点を配置しただけでは線は作成されません。
   </div>

   <div class="formGroup">
    <label>駅名</label>
    <input
     id="newStationName"
     type="text"
     placeholder="例：東京駅"
    >
   </div>

   <button
    id="stationModeButton"
    class="full"
   >
    駅を追加
   </button>

   <div class="spacer"></div>

   <button
    id="branchModeButton"
    class="full"
   >
    分岐点を追加
   </button>

   <div class="spacer"></div>

   <button
    id="moveModeButton"
    class="full"
   >
    移動
   </button>

   <div class="spacer"></div>

   <button
    id="connectModeButton"
    class="full primary"
   >
    接続
   </button>

   <div class="spacer"></div>

   <button
    id="deleteModeButton"
    class="full danger"
   >
    駅・分岐点を削除
   </button>

   <hr>

   <div class="title">
    表示設定
   </div>

   <div class="formGroup">

    <label>線の太さ</label>

    <div class="rangeRow">

     <input
      id="lineWidth"
      type="range"
      min="2"
      max="20"
      value="7"
     >

     <span
      id="lineWidthValue"
      class="rangeValue"
     >
      7px
     </span>

    </div>

   </div>

   <div class="formGroup">

    <label>点の大きさ</label>

    <div class="rangeRow">

     <input
      id="nodeSize"
      type="range"
      min="8"
      max="28"
      value="14"
     >

     <span
      id="nodeSizeValue"
      class="rangeValue"
     >
      14px
     </span>

    </div>

   </div>

   <hr>

   <div class="title">
    路線追加
   </div>

   <div class="formGroup">

    <label>路線名</label>

    <input
     id="routeName"
     type="text"
     placeholder="例：山手線"
    >

   </div>

   <div class="formGroup">

    <label>路線アルファベット</label>

    <input
     id="routeCode"
     type="text"
     maxlength="6"
     placeholder="例：JY"
    >

   </div>

   <div class="formGroup">

    <label>路線色</label>

    <input
     id="routeColor"
     type="color"
     value="#80C342"
    >

   </div>

   <button
    id="addRoute"
    class="full primary"
   >
    路線を追加
   </button>

  </div>

 </section>

 <!-- 路線一覧 -->

 <section id="routesPanel" class="panel">

  <div class="panelInner">

   <div class="title">
    路線一覧
   </div>

   <div
    id="routeList"
    class="list"
   ></div>

  </div>

 </section>

 <!-- 駅一覧 -->

 <section id="stationsPanel" class="panel">

  <div class="panelInner">

   <div class="title">
    駅一覧
   </div>

   <div
    id="stationList"
    class="list"
   ></div>

  </div>

 </section>

 <!-- 詳細 -->

 <section id="detailPanel" class="panel">

  <div
   id="detailContent"
   class="panelInner"
  ></div>

 </section>

</aside>

<main id="mapArea">

 <div id="map"></div>

 <button id="mobileMenu">
  ☰
 </button>

 <div id="toolbar">

  <button
   id="toolbarMove"
   class="tool active"
  >
   移動
  </button>

  <button
   id="toolbarStation"
   class="tool"
  >
   駅追加
  </button>

  <button
   id="toolbarBranch"
   class="tool"
  >
   分岐点追加
  </button>

  <button
   id="toolbarConnect"
   class="tool"
  >
   接続
  </button>

  <button
   id="toolbarDelete"
   class="tool delete"
  >
   削除
  </button>

 </div>

 <div id="status">
  移動モード
 </div>

</main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

/* =========================================================
   データ
========================================================= */

const state = {

 nodes:[],
 edges:[],
 routes:[],

 nextNodeId:1,
 nextEdgeId:1,
 nextRouteId:1,

 mode:"move",

 connectingRouteId:null,
 connectLastNodeId:null,

 lineWidth:7,
 nodeSize:14
};

const STORAGE_KEY =
 "rosenzumeekaa_data_v3";

/* =========================================================
   保存
========================================================= */

function save(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(state)
 );

}

/* =========================================================
   読み込み
========================================================= */

function load(){

 const raw =
  localStorage.getItem(STORAGE_KEY);

 if(!raw){
  return;
 }

 try{

  const data =
   JSON.parse(raw);

  if(Array.isArray(data.nodes)){
   state.nodes=data.nodes;
  }

  if(Array.isArray(data.edges)){
   state.edges=data.edges;
  }

  if(Array.isArray(data.routes)){
   state.routes=data.routes;
  }

  state.nextNodeId =
   Number(data.nextNodeId)||1;

  state.nextEdgeId =
   Number(data.nextEdgeId)||1;

  state.nextRouteId =
   Number(data.nextRouteId)||1;

  state.lineWidth =
   Number(data.lineWidth)||7;

  state.nodeSize =
   Number(data.nodeSize)||14;

 }catch(e){

  /*
   壊れた保存データがあっても
   alertは使用せず初期状態に戻す
  */

  state.nodes=[];
  state.edges=[];
  state.routes=[];

 }

}

/* =========================================================
   地図
========================================================= */

const map =
 L.map("map",{
  zoomControl:true,
  attributionControl:true
 }).setView(
  [35.681236,139.767125],
  13
 );

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:19,
  attribution:
   '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
 }
).addTo(map);

const edgeLayer =
 L.layerGroup().addTo(map);

const nodeLayer =
 L.layerGroup().addTo(map);

/* =========================================================
   DOM
========================================================= */

const status =
 document.getElementById("status");

const newStationName =
 document.getElementById("newStationName");

const routeName =
 document.getElementById("routeName");

const routeCode =
 document.getElementById("routeCode");

const routeColor =
 document.getElementById("routeColor");

const lineWidth =
 document.getElementById("lineWidth");

const nodeSize =
 document.getElementById("nodeSize");

const lineWidthValue =
 document.getElementById("lineWidthValue");

const nodeSizeValue =
 document.getElementById("nodeSizeValue");

/* =========================================================
   状態表示
========================================================= */

function setStatus(text){

 status.textContent=text;

}

/* =========================================================
   モード
========================================================= */

function setMode(mode){

 state.mode=mode;

 state.connectLastNodeId=null;

 const buttons =
  document.querySelectorAll(".tool");

 buttons.forEach(
  b => b.classList.remove("active")
 );

 document
  .querySelectorAll(
   "#stationModeButton,#branchModeButton,#moveModeButton,#connectModeButton,#deleteModeButton"
  )
  .forEach(
   b => b.classList.remove("active")
  );

 if(mode==="move"){

  document
   .getElementById("toolbarMove")
   .classList.add("active");

  document
   .getElementById("moveModeButton")
   .classList.add("active");

  setStatus("移動モード");

 }

 if(mode==="station"){

  document
   .getElementById("toolbarStation")
   .classList.add("active");

  document
   .getElementById("stationModeButton")
   .classList.add("active");

  setStatus(
   "駅追加モード：地図をクリック"
  );

 }

 if(mode==="branch"){

  document
   .getElementById("toolbarBranch")
   .classList.add("active");

  document
   .getElementById("branchModeButton")
   .classList.add("active");

  setStatus(
   "分岐点追加モード：地図をクリック"
  );

 }

 if(mode==="connect"){

  document
   .getElementById("toolbarConnect")
   .classList.add("active");

  document
   .getElementById("connectModeButton")
   .classList.add("active");

  setStatus(
   "接続モード：路線を選択してください"
  );

 }

 if(mode==="delete"){

  document
   .getElementById("toolbarDelete")
   .classList.add("active");

  document
   .getElementById("deleteModeButton")
   .classList.add("active");

  setStatus(
   "削除モード：駅・分岐点をクリック"
  );

 }

 renderNodes();

}

/* =========================================================
   モードボタン
========================================================= */

document
 .getElementById("toolbarMove")
 .onclick=()=>{
  setMode("move");
 };

document
 .getElementById("toolbarStation")
 .onclick=()=>{
  setMode("station");
 };

document
 .getElementById("toolbarBranch")
 .onclick=()=>{
  setMode("branch");
 };

document
 .getElementById("toolbarConnect")
 .onclick=()=>{
  startConnect();
 };

document
 .getElementById("toolbarDelete")
 .onclick=()=>{
  setMode("delete");
 };

document
 .getElementById("moveModeButton")
 .onclick=()=>{
  setMode("move");
 };

document
 .getElementById("stationModeButton")
 .onclick=()=>{
  setMode("station");
 };

document
 .getElementById("branchModeButton")
 .onclick=()=>{
  setMode("branch");
 };

document
 .getElementById("connectModeButton")
 .onclick=()=>{
  startConnect();
 };

document
 .getElementById("deleteModeButton")
 .onclick=()=>{
  setMode("delete");
 };

/* =========================================================
   地図クリック
========================================================= */

map.on(
 "click",
 function(e){

  if(state.mode==="station"){

   createNode(
    e.latlng.lat,
    e.latlng.lng,
    "station"
   );

   return;
  }

  if(state.mode==="branch"){

   createNode(
    e.latlng.lat,
    e.latlng.lng,
    "branch"
   );

   return;
  }

 }
);

/* =========================================================
   ノード作成
========================================================= */

function createNode(lat,lng,type){

 let name;

 if(type==="station"){

  name =
   newStationName.value.trim();

  if(!name){
   name="新しい駅";
  }

 }else{

  name="分岐点";

 }

 const node={
  id:state.nextNodeId++,
  type:type,
  name:name,
  lat:lat,
  lng:lng
 };

 state.nodes.push(node);

 save();
 renderAll();

 newStationName.value="";

 setStatus(
  type==="station"
   ? "駅を追加しました"
   : "分岐点を追加しました"
 );

}

/* =========================================================
   ノードアイコン
========================================================= */

function nodeIcon(node){

 return L.divIcon({

  className:"",

  iconSize:[
   state.nodeSize+110,
   state.nodeSize+4
  ],

  iconAnchor:[
   state.nodeSize/2,
   state.nodeSize/2
  ],

  html:
   '<div class="nodeContainer" style="--nodeSize:'+
   state.nodeSize+
   'px">'+

   '<div class="nodeDot '+
   (node.type==="branch"?"branch":"")+
   '"></div>'+

   '<div class="nodeLabel">'+
   escapeHTML(node.name)+
   '</div>'+

   '</div>'

 });

}

/* =========================================================
   ノード描画
========================================================= */

function renderNodes(){

 nodeLayer.clearLayers();

 state.nodes.forEach(
  node=>{

   const marker =
    L.marker(
     [node.lat,node.lng],
     {
      icon:nodeIcon(node),
      draggable:
       state.mode==="move",
      zIndexOffset:
       state.mode==="connect"
        ? 1000
        : 100
     }
    );

   marker.addTo(nodeLayer);

   marker.on(
    "click",
    function(e){

     L.DomEvent.stopPropagation(e);

     nodeClicked(node.id);

    }
   );

   marker.on(
    "dragend",
    function(e){

     if(state.mode!=="move"){
      return;
     }

     const p =
      e.target.getLatLng();

     node.lat=p.lat;
     node.lng=p.lng;

     save();

     renderEdges();

    }
   );

  }
 );

}

/* =========================================================
   ノードクリック
========================================================= */

function nodeClicked(nodeId){

 if(state.mode==="delete"){

  removeNode(nodeId);
  return;

 }
