<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>架空鉄道路線マップメーカー</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background:#f4f5f7;
  color:#222;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
  height:58px;
  flex:none;
  background:#fff;
  border-bottom:1px solid #d7dbe0;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
  z-index:2000;
}

.logo{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:nowrap;
}

.header-btn{
  background:#f1f3f5;
  border:1px solid #d6d9dd;
  border-radius:8px;
  padding:8px 12px;
  font-weight:700;
  white-space:nowrap;
}

.header-btn:hover{
  background:#e8ebee;
}

.header-btn.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.header-spacer{
  flex:1;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

#map{
  flex:1;
  min-width:0;
  height:100%;
  z-index:1;
}

/* =========================
   SIDE MENU
========================= */

.sidebar{
  width:320px;
  flex:none;
  background:#fff;
  border-right:1px solid #d8dce0;
  display:flex;
  flex-direction:column;
  z-index:1500;
  overflow:hidden;
}

.sidebar-head{
  padding:13px 15px;
  border-bottom:1px solid #e0e3e6;
  display:flex;
  align-items:center;
  gap:8px;
}

.sidebar-title{
  font-weight:900;
  font-size:18px;
}

.sidebar-content{
  flex:1;
  overflow:auto;
  padding:12px;
}

.section{
  margin-bottom:16px;
}

.section-title{
  font-size:13px;
  font-weight:900;
  color:#66707a;
  margin-bottom:7px;
  padding-left:2px;
}

.menu-button{
  width:100%;
  text-align:left;
  padding:11px 12px;
  background:#f5f6f7;
  border:1px solid #dfe2e5;
  border-radius:9px;
  margin-bottom:7px;
  font-weight:700;
}

.menu-button:hover{
  background:#eceff2;
}

.menu-button.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.form-row{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.form-row > *{
  min-width:0;
}

input[type="text"],
input[type="number"],
input[type="color"],
select{
  width:100%;
  padding:9px 10px;
  border:1px solid #cfd4d9;
  border-radius:7px;
  background:#fff;
}

input[type="color"]{
  height:42px;
  padding:3px;
}

.small-button{
  padding:9px 11px;
  border-radius:7px;
  background:#222;
  color:#fff;
  font-weight:700;
  white-space:nowrap;
}

.secondary-button{
  padding:9px 11px;
  border-radius:7px;
  background:#eef0f2;
  border:1px solid #d6d9dd;
  font-weight:700;
  white-space:nowrap;
}

.danger-button{
  padding:9px 11px;
  border-radius:7px;
  background:#fff0f0;
  color:#b00000;
  border:1px solid #efbaba;
  font-weight:700;
}

/* =========================
   LIST
========================= */

.list-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#fff;
  border:1px solid #dfe2e5;
  border-radius:9px;
  margin-bottom:7px;
  text-align:left;
}

.list-item:hover{
  background:#f7f8f9;
}

.list-item-main{
  flex:1;
  min-width:0;
}

.list-item-name{
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.list-item-sub{
  font-size:12px;
  color:#737b84;
  margin-top:2px;
}

.route-mini{
  width:35px;
  height:35px;
  flex:none;
  border-radius:9px;
  border:4px solid #7fce39;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:900;
}

/* =========================
   MODE BAR
========================= */

.modebar{
  position:absolute;
  left:15px;
  top:15px;
  z-index:1000;
  display:flex;
  gap:6px;
  background:#fff;
  padding:6px;
  border-radius:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.16);
}

.mode-btn{
  padding:9px 12px;
  border-radius:7px;
  background:#f0f2f4;
  font-weight:800;
}

.mode-btn.active{
  background:#222;
  color:#fff;
}

/* =========================
   MAP INFO
========================= */

.map-status{
  position:absolute;
  left:15px;
  bottom:15px;
  z-index:1000;
  background:rgba(255,255,255,.95);
  border:1px solid #d8dce0;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  border-radius:9px;
  padding:8px 11px;
  font-size:13px;
  font-weight:700;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(760px,100%);
  max-height:min(90vh,900px);
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px 60px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
}

.modal-header{
  padding:15px 18px;
  border-bottom:1px solid #e0e3e6;
  display:flex;
  align-items:center;
  gap:10px;
}

.modal-title{
  font-weight:900;
  font-size:20px;
  flex:1;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:8px;
  background:#f0f2f4;
  font-size:22px;
  line-height:1;
}

.modal-body{
  padding:18px;
  overflow:auto;
}

.modal-footer{
  padding:13px 18px;
  border-top:1px solid #e0e3e6;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* =========================
   ROUTE HEADER / NUMBERING
========================= */

.route-header-card{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px;
  background:#f7f8f9;
  border:1px solid #e0e3e6;
  border-radius:13px;
  margin-bottom:18px;
}

.route-logo-large{
  width:115px;
  height:115px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  position:relative;
  background:#7fce39;
  box-shadow:
    inset 0 0 0 4px rgba(0,0,0,.08);
}

.route-logo-inner{
  width:78px;
  height:78px;
  background:#fff;
  border:4px solid #fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#222;
  line-height:1;
  font-weight:1000;
  border-radius:0;
}

.route-logo-code{
  font-size:27px;
  letter-spacing:-1px;
}

.route-logo-number{
  font-size:31px;
  margin-top:6px;
}

.route-title-large{
  min-width:0;
}

.route-title-large h2{
  margin:0;
  font-size:29px;
}

.route-title-large p{
  margin:5px 0 0;
  color:#6d747b;
  font-weight:700;
}

.station-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.station-row{
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid #e0e3e6;
  border-radius:10px;
  padding:9px;
  background:#fff;
}

.station-row:hover{
  background:#f8f9fa;
}

.station-row-number{
  width:48px;
  flex:none;
  display:flex;
  justify-content:center;
}

.station-row-name{
  flex:1;
  font-size:16px;
  font-weight:800;
}

.station-row-actions{
  display:flex;
  gap:5px;
}

.tiny-button{
  padding:6px 8px;
  border-radius:6px;
  background:#eef0f2;
  font-size:12px;
  font-weight:800;
}

/* =========================
   STATION DETAIL
========================= */

.station-detail-head{
  padding:18px;
  border-radius:13px;
  background:#f7f8f9;
  border:1px solid #e0e3e6;
  margin-bottom:18px;
}

.station-detail-head h2{
  margin:0;
  font-size:28px;
}

.station-detail-head p{
  margin:5px 0 0;
  color:#70777f;
}

.line-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px;
  border:1px solid #dfe2e5;
  border-radius:11px;
  margin-bottom:8px;
}

.line-card-info{
  flex:1;
  min-width:0;
}

.line-card-name{
  font-weight:900;
}

.line-card-code{
  color:#747b82;
  font-size:13px;
}

.numbering-logo{
  width:54px;
  height:54px;
  flex:none;
  border-radius:11px;
  background:#7fce39;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:5px;
}

.numbering-logo .inner{
  background:#fff;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#222;
  font-weight:1000;
  line-height:1;
}

.numbering-logo .code{
  font-size:13px;
}

.numbering-logo .num{
  font-size:16px;
  margin-top:3px;
}

/* =========================
   LEAFLET OVERRIDES
========================= */

.leaflet-control-zoom a{
  font-weight:900;
}

.leaflet-popup-content{
  margin:12px 14px;
}

.popup-name{
  font-weight:900;
  font-size:16px;
}

.popup-actions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.popup-actions button{
  padding:6px 8px;
  background:#f0f2f4;
  border-radius:6px;
  font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  header{
    height:54px;
    padding:0 8px;
    gap:6px;
  }

  .logo{
    font-size:16px;
  }

  .header-btn{
    padding:7px 8px;
    font-size:12px;
  }

  .sidebar{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:min(330px,88vw);
    transform:translateX(-100%);
    transition:transform .2s ease;
    box-shadow:4px 0 18px rgba(0,0,0,.16);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .modebar{
    left:8px;
    top:8px;
  }

  .map-status{
    left:8px;
    bottom:8px;
  }

}

@media(min-width:851px){
  .mobile-menu-button{
    display:none;
  }
}
</style>
</head>

<body>

<div id="app">

<header>

  <button
    class="header-btn mobile-menu-button"
    id="menuToggle"
  >☰</button>

  <div class="logo">
    路線マップメーカー
  </div>

  <div class="header-actions">

    <button
      class="header-btn"
      id="addStationBtn"
    >＋駅</button>

    <button
      class="header-btn"
      id="addJunctionBtn"
    >＋分岐点</button>

    <button
      class="header-btn"
      id="addRouteBtn"
    >＋路線</button>

    <button
      class="header-btn"
      id="routeDetailBtn"
    >路線詳細</button>

  </div>

  <div class="header-spacer"></div>

  <button
    class="header-btn"
    id="saveBtn"
  >保存</button>

</header>

<div class="main">

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-head">
      <div class="sidebar-title">メニュー</div>
    </div>

    <div class="sidebar-content">

      <div class="section">

        <div class="section-title">
          路線
        </div>

        <div id="routeList"></div>

      </div>

      <div class="section">

        <div class="section-title">
          駅・分岐点
        </div>

        <div id="stationList"></div>

      </div>

      <div class="section">

        <div class="section-title">
          表示設定
        </div>

        <div class="form-row">
          <label style="flex:1">
            <div style="font-size:12px;font-weight:800;margin-bottom:4px">
              線の太さ
            </div>
            <input
              type="number"
              id="lineWidth"
              min="1"
              max="30"
              step="1"
            >
          </label>

          <label style="flex:1">
            <div style="font-size:12px;font-weight:800;margin-bottom:4px">
              点の大きさ
            </div>
            <input
              type="number"
              id="pointSize"
              min="3"
              max="30"
              step="1"
            >
          </label>
        </div>

        <button
          class="small-button"
          style="width:100%"
          id="applyStyleBtn"
        >
          一括設定を適用
        </button>

      </div>

      <div class="section">

        <div class="section-title">
          選択中の路線
        </div>

        <div id="selectedRoutePanel"></div>

      </div>

    </div>

  </aside>

  <div id="map"></div>

  <div class="modebar">

    <button
      class="mode-btn active"
      data-mode="move"
    >
      移動
    </button>

    <button
      class="mode-btn"
      data-mode="connect"
    >
      接続
    </button>

    <button
      class="mode-btn"
      data-mode="station"
    >
      駅
    </button>

    <button
      class="mode-btn"
      data-mode="junction"
    >
      分岐点
    </button>

  </div>

  <div
    class="map-status"
    id="mapStatus"
  >
    移動モード
  </div>

</div>

</div>

<!-- =========================
     ROUTE DETAIL MODAL
========================= -->

<div
  class="modal-backdrop"
  id="routeDetailModal"
>

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="routeDetailTitle"
      >
        路線詳細
      </div>

      <button
        class="close-btn"
        data-close="routeDetailModal"
      >
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="routeDetailBody"
    ></div>

  </div>

</div>

<!-- =========================
     STATION DETAIL MODAL
========================= -->

<div
  class="modal-backdrop"
  id="stationDetailModal"
>

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="stationDetailTitle"
      >
        駅詳細
      </div>

      <button
        class="close-btn"
        data-close="stationDetailModal"
      >
        ×
      </button>

    </div>

    <div
      class="modal-body"
      id="stationDetailBody"
    ></div>

  </div>

</div>

<!-- =========================
     ROUTE CREATE MODAL
========================= -->

<div
  class="modal-backdrop"
  id="routeCreateModal"
>

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title">
        路線を追加
      </div>

      <button
        class="close-btn"
        data-close="routeCreateModal"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="section">

        <div class="section-title">
          路線名
        </div>

        <input
          type="text"
          id="newRouteName"
          placeholder="例：山手線"
        >

      </div>

      <div class="section">

        <div class="section-title">
          路線アルファベット
        </div>

        <input
          type="text"
          id="newRouteCode"
          placeholder="例：JY"
          maxlength="4"
        >

      </div>

      <div class="section">

        <div class="section-title">
          路線色
        </div>

        <input
          type="color"
          id="newRouteColor"
          value="#7fcf3d"
        >

      </div>

      <div class="section">

        <div class="section-title">
          ナンバリング
        </div>

        <select id="newRouteNumbering">

          <option value="sequential">
            クリック順に自動採番
          </option>

          <option value="none">
            ナンバリングなし
          </option>

        </select>

      </div>

    </div>

    <div class="modal-footer">

      <button
        class="secondary-button"
        data-close="routeCreateModal"
      >
        キャンセル
      </button>

      <button
        class="small-button"
        id="createRouteConfirm"
      >
        路線を作成
      </button>

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let data = loadData();

let map;

let mode = "move";

let selectedRouteId = "route-yamanote";

let selectedNodeId = null;

let connectLastNodeId = null;

let markerLayer = L.layerGroup();

let lineLayer = L.layerGroup();

let nodeMarkers = new Map();

let connectionLayers = [];

let routePolylineLayers = new Map();

/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

  initMap();

  bindUI();

  createDefaultYamanoteConnections();

  normalizeRouteStations();

  renderEverything();

});

/* =========================================================
   MAP
========================================================= */

function initMap(){

  map = L.map("map",{
    zoomControl:true,
    attributionControl:true
  }).setView(
    [35.681236,139.767125],
    12
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
  ).addTo(map);

  lineLayer.addTo(map);

  markerLayer.addTo(map);

}

/* =========================================================
   DEFAULT YAMANOTE
========================================================= */

function createDefaultYamanoteConnections(){

  const route = data.routes.find(
    r=>r.id==="route-yamanote"
  );

  if(!route){
    return;
  }

  if(route.stations.length>0){
    return;
  }

  route.stations =
    data.nodes
      .filter(n=>n.type==="station")
      .sort((a,b)=>{

        const an=parseInt(
          a.id.replace("JY",""),
          10
        );

        const bn=parseInt(
          b.id.replace("JY",""),
          10
        );

        return an-bn;

      })
      .map(n=>n.id);

  for(let i=0;i<route.stations.length-1;i++){

    addConnection(
      route.id,
      route.stations[i],
      route.stations[i+1]
    );

  }

  addConnection(
    route.id,
    route.stations[route.stations.length-1],
    route.stations[0]
  );

}

/* =========================================================
   CONNECTION
========================================================= */

function addConnection(routeId,a,b){

  if(!a || !b || a===b){
    return false;
  }

  const route =
    data.routes.find(r=>r.id===routeId);

  if(!route){
    return false;
  }

  const exists =
    data.connections.some(
      c=>
        c.routeId===routeId &&
        (
          (c.a===a && c.b===b) ||
          (c.a===b && c.b===a)
        )
    );

  if(exists){
    return false;
  }

  data.connections.push({
    id:"connection-"+Date.now()+"-"+Math.random(),
    routeId,
    a,
    b
  });

  return true;
}

/* =========================================================
   NORMALIZE ROUTE STATIONS
========================================================= */

function normalizeRouteStations(){

  data.routes.forEach(route=>{

    if(!Array.isArray(route.stations)){
      route.stations=[];
    }

    route.stations =
      route.stations.filter(
        id=>data.nodes.some(n=>n.id===id)
      );

  });

}

/* =========================================================
   RENDER
========================================================= */

function renderEverything(){

  renderMap();

  renderRouteList();

  renderStationList();

  renderSelectedRoutePanel();

  updateInputs();

}

/* =========================================================
   MAP RENDER
========================================================= */

function renderMap(){

  markerLayer.clearLayers();

  lineLayer.clearLayers();

  nodeMarkers.clear();

  connectionLayers=[];

  routePolylineLayers.clear();

  data.connections.forEach(connection=>{

    const route =
      data.routes.find(
        r=>r.id===connection.routeId
      );

    const a =
      data.nodes.find(
        n=>n.id===connection.a
      );

    const b =
      data.nodes.find(
        n=>n.id===connection.b
      );

    if(!route || !a || !b){
      return;
    }

    const polyline =
      L.polyline(
        [
          [a.lat,a.lng],
          [b.lat,b.lng]
        ],
        {
          color:route.color,
          weight:data.settings.lineWidth,
          opacity:.95,
          lineCap:"round",
          lineJoin:"round"
        }
      );

    polyline.addTo(lineLayer);

    connectionLayers.push(polyline);

  });

  data.nodes.forEach(node=>{

    const marker =
      createNodeMarker(node);

    marker.addTo(markerLayer);

    nodeMarkers.set(
      node.id,
      marker
    );

  });

}

/* =========================================================
   NODE MARKER
========================================================= */

function createNodeMarker(node){

  const size =
    data.settings.pointSize*2;

  let className =
    node.type==="station"
      ? "station-map-marker"
      : "junction-map-marker";

  const div =
    L.divIcon({

      className:"custom-node-icon",

      html:
        `
        <div
          class="${className}"
          style="
            width:${size}px;
            height:${size}px;
          "
        ></div>
        `,

      iconSize:[
        size,
        size
      ],

      iconAnchor:[
        size/2,
        size/2
      ]

    });

  const marker =
    L.marker(
      [node.lat,node.lng],
      {
        icon:div,
        draggable:mode==="move"
      }
    );

  marker.on(
    "click",
    e=>{

      L.DomEvent.stopPropagation(e);

      handleNodeClick(node.id);

    }
  );

  marker.on(
    "dragend",
    ()=>{

      if(mode!=="move"){
        return;
      }

      const pos =
        marker.getLatLng();

      node.lat=pos.lat;
      node.lng=pos.lng;

      saveData();

      renderEverything();

    }
  );

  marker.bindTooltip(
    node.name,
    {
      direction:"top",
      offset:[0,-8],
      permanent:true,
      className:"station-name-tooltip"
    }
  );

  return marker;

}

/* =========================================================
   NODE CLICK
========================================================= */

function handleNodeClick(nodeId){

  if(mode==="connect"){

    handleConnectClick(nodeId);

    return;

  }

  selectedNodeId=nodeId;

  const node =
    data.nodes.find(
      n=>n.id===nodeId
    );

  if(node){

    openStationDetail(nodeId);

  }

}

/* =========================================================
   CONNECT MODE
========================================================= */

function handleConnectClick(nodeId){

  if(!selectedRouteId){

    return;

  }

  const route =
    data.routes.find(
      r=>r.id===selectedRouteId
    );

  if(!route){
    return;
  }

  /*
    最初の駅をクリック
  */

  if(!connectLastNodeId){

    connectLastNodeId=nodeId;

    setStatus(
      "「"+
      getNode(nodeId).name+
      "」を始点にしました。次の駅をクリックしてください。"
    );

    highlightConnectNode(nodeId);

    return;

  }

  /*
    同じ駅を再クリック
    → 何もしない
  */

  if(connectLastNodeId===nodeId){

    setStatus(
      "同じ駅には接続しません。"
    );

    return;

  }

  /*
    ここが重要。

    A → B とクリックしたら

    A-Bを作成
    そのままBを現在位置にする。

    したがって、

    A → B → C → D

    とクリックするだけで

    A-B
    B-C
    C-D

    が生成される。
  */

  const previous =
    connectLastNodeId;

  const added =
    addConnection(
      selectedRouteId,
      previous,
      nodeId
    );

  if(added){

    if(!route.stations.includes(previous)){
      route.stations.push(previous);
    }

    if(!route.stations.includes(nodeId)){
      route.stations.push(nodeId);
    }

    connectLastNodeId=nodeId;

    autoRenumberRoute(route);

    saveData();

    renderEverything();

    highlightConnectNode(nodeId);

    setStatus(
      getNode(previous).name+
      " → "+
      getNode(nodeId).name+
      " を接続しました。次をクリックしてください。"
    );

  }else{

    /*
      既存線の場合も、
      クリックした駅を現在位置として扱う。

      これにより途中駅をもう一度クリックして
      線をつなぎ直す必要がない。
    */

    connectLastNodeId=nodeId;

    setStatus(
      "既存の接続です。「"+
      getNode(nodeId).name+
      "」を現在位置にしました。"
    );

  }

}

/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightConnectNode(nodeId){

  nodeMarkers.forEach(
    (marker,id)=>{

      const el =
        marker.getElement();

      if(!el){
        return;
      }

      const point =
        el.querySelector(
          ".station-map-marker,.junction-map-marker"
        );

      if(!point){
        return;
      }

      if(id===nodeId){

        point.style.boxShadow=
          "0 0 0 4px rgba(255,120,0,.8)";

      }else{

        point.style.boxShadow="";

      }

    }
  );

}

/* =========================================================
   ROUTE AUTO NUMBERING
========================================================= */

function autoRenumberRoute(route){

  if(!route.numbering){
    return;
  }

  route.stations.forEach(
    (nodeId,index)=>{

      const node =
        getNode(nodeId);

      if(!node){
        return;
      }

      /*
        ルート順で番号を作る。

        例：
        JY + 01
        JY + 02
        JY + 03
      */

      node.routeNumbers =
        node.routeNumbers || {};

      node.routeNumbers[
        route.id
      ] =
        route.code+
        String(index+1).padStart(2,"0");

    }
  );

}

/* =========================================================
   NUMBERING LOGO
========================================================= */

function createNumberingLogoHTML(
  route,
  number
){

  const digits =
    number.replace(
      route.code,
      ""
    );

  return `
    <div
      class="numbering-logo"
      style="background:${escapeHtml(route.color)}"
    >

      <div class="inner">

        <div class="code">
          ${escapeHtml(route.code)}
        </div>

        <div class="num">
          ${escapeHtml(digits)}
        </div>

      </div>

    </div>
  `;

}

/* =========================================================
   ROUTE CREATION
========================================================= */

function createRoute(){

  const name =
    document
      .getElementById(
        "newRouteName"
      )
      .value
      .trim();

  const code =
    document
      .getElementById(
        "newRouteCode"
      )
      .value
      .trim()
      .toUpperCase();

  const color =
    document
      .getElementById(
        "newRouteColor"
      )
      .value;

  const numbering =
    document
      .getElementById(
        "newRouteNumbering"
      )
      .value==="sequential";

  if(!name){
    return;
  }

  const route={
    id:
      "route-"+Date.now()+"-"+Math.random(),

    name,

    code,

    color,

    numbering,

    stations:[]
  };

  data.routes.push(route);

  selectedRouteId=route.id;

  saveData();

  renderEverything();

  closeModal(
    "routeCreateModal"
  );

  setStatus(
    "路線「"+route.name+
    "」を作成しました。"
  );

}

/* =========================================================
   ADD NODE
========================================================= */

function startAddNode(type){

  setMode(
    type==="station"
      ? "station"
      : "junction"
  );

  setStatus(
    type==="station"
      ? "地図上をクリックすると駅を追加します。"
      : "地図上をクリックすると分岐点を追加します。"
  );

}

/* =========================================================
   MAP CLICK FOR NODE
========================================================= */

function handleMapClick(e){

  if(mode!=="station" && mode!=="junction"){
    return;
  }

  const type =
    mode==="station"
      ? "station"
      : "junction";

  const name =
    type==="station"
      ? "新しい駅"
      : "分岐点";

  const node={

    id:
      "node-"+Date.now()+"-"+Math.random(),

    name,

    type,

    lat:e.latlng.lat,

    lng:e.latlng.lng,

    routeNumbers:{}

  };

  data.nodes.push(node);

  saveData();

  renderEverything();

  setMode("move");

  openStationDetail(node.id);

}

/* =========================================================
   DELETE NODE
========================================================= */

function deleteNode(nodeId){

  data.nodes=
    data.nodes.filter(
      n=>n.id!==nodeId
    );

  data.connections=
    data.connections.filter(
      c=>
        c.a!==nodeId &&
        c.b!==nodeId
    );

  data.routes.forEach(
    route=>{
      route.stations=
        route.stations.filter(
          id=>id!==nodeId
        );

      autoRenumberRoute(route);
    }
  );

  if(
    selectedNodeId===nodeId
  ){
    selectedNodeId=null;
  }

  saveData();

  renderEverything();

}

/* =========================================================
   DELETE ROUTE
========================================================= */

function deleteRoute(routeId){

  data.routes=
    data.routes.filter(
      r=>r.id!==routeId
    );

  data.connections=
    data.connections.filter(
      c=>c.routeId!==routeId
    );

  if(
    selectedRouteId===routeId
  ){

    selectedRouteId=
      data.routes.length
        ? data.routes[0].id
        : null;

  }

  connectLastNodeId=null;

  saveData();

  renderEverything();

}

/* =========================================================
   INPUTS
========================================================= */

function updateInputs(){

  document.getElementById(
    "lineWidth"
  ).value=
    data.settings.lineWidth;

  document.getElementById(
    "pointSize"
  ).value=
    data.settings.pointSize;

}

/* =========================================================
   STYLE
========================================================= */

function applyGlobalStyle(){

  const width =
    Number(
      document.getElementById(
        "lineWidth"
      ).value
    );

  const point =
    Number(
      document.getElementById(
        "pointSize"
      ).value
    );

  data.settings.lineWidth =
    Math.max(
      1,
      Math.min(30,width || 6)
    );

  data.settings.pointSize =
    Math.max(
      3,
      Math.min(30,point || 9)
    );

  saveData();

  renderMap();

}

/* =========================================================
   MODE
========================================================= */

function setMode(newMode){

  mode=newMode;

  if(newMode!=="connect"){
    connectLastNodeId=null;
  }

  document
    .querySelectorAll(".mode-btn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.mode===newMode
      );

    });

  const text={

    move:"移動モード",

    connect:
      selectedRouteId
        ? "接続モード："+
          getRoute(selectedRouteId).name+
          "を選択中"
        : "接続モード",

    station:
      "駅追加モード：地図をクリック",

    junction:
      "分岐点追加モード：地図をクリック"

  };

  setStatus(
    text[newMode]
  );

  renderMap();

}

/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  document.getElementById(
    "mapStatus"
  ).textContent=text;

}

/* =========================================================
   HELPERS
========================================================= */

function getNode(id){

  return data.nodes.find(
    n=>n.id===id
  );

}

function getRoute(id){

  return data.routes.find(
    r=>r.id===id
  );

}

function getNodeRouteNumbers(node){

  return data.routes
    .filter(
      route=>
        route.stations.includes(
          node.id
        )
    )
    .map(
      route=>{

        const index =
          route.stations.indexOf(
            node.id
          );

        return route.numbering
          ? route.code+
            String(index+1).padStart(2,"0")
          : route.code;

      }
    );

}

function getNodeRouteNumber(
  node,
  routeId
){

  const route =
    getRoute(routeId);

  if(!route){
    return "";
  }

  const index =
    route.stations.indexOf(
      node.id
    );

  if(index<0){
    return "";
  }

  return route.numbering
    ? route.code+
      String(index+1).padStart(2,"0")
    : route.code;

}

function getFirstRouteColor(node){

  const route =
    data.routes.find(
      r=>r.stations.includes(
        node.id
      )
    );

  return route
    ? route.color
    : "#777";

}

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        closeModal(
          button.dataset.close
        );
      }
    );

  });

document
  .querySelectorAll(
    ".modal-backdrop"
  )
  .forEach(backdrop=>{

    backdrop.addEventListener(
      "click",
      e=>{

        if(e.target===backdrop){

          backdrop.classList.remove(
            "show"
          );

        }

      }
    );

  });

/* =========================================================
   UI EVENTS
========================================================= */

function bindUI(){

  map.on(
    "click",
    handleMapClick
  );

  document
    .querySelectorAll(".mode-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          setMode(
            button.dataset.mode
          );

        }
      );

    });

  document
    .getElementById(
      "addStationBtn"
    )
    .addEventListener(
      "click",
      ()=>{
        startAddNode("station");
      }
    );

  document
    .getElementById(
      "addJunctionBtn"
    )
    .addEventListener(
      "click",
      ()=>{
        startAddNode("junction");
      }
    );

  document
    .getElementById(
      "addRouteBtn"
    )
    .addEventListener(
      "click",
      ()=>{

        document
          .getElementById(
            "routeCreateModal"
          )
          .classList.add("show");

        setTimeout(
          ()=>{
            document
              .getElementById(
                "newRouteName"
              )
              .focus();
          },
          50
        );

      }
    );

  document
    .getElementById(
      "routeDetailBtn"
    )
    .addEventListener(
      "click",
      ()=>{

        if(selectedRouteId){

          openRouteDetail(
            selectedRouteId
          );

        }

      }
    );

  document
    .getElementById(
      "createRouteConfirm"
    )
    .addEventListener(
      "click",
      createRoute
    );

  document
    .getElementById(
      "applyStyleBtn"
    )
    .addEventListener(
      "click",
      applyGlobalStyle
    );

  document
    .getElementById(
      "saveBtn"
    )
    .addEventListener(
      "click",
      ()=>{

        saveData();

        setStatus(
          "保存しました。"
        );

      }
    );

  document
    .getElementById(
      "menuToggle"
    )
    .addEventListener(
      "click",
      ()=>{

        document
          .getElementById(
            "sidebar"
          )
          .classList.toggle(
            "open"
          );

      }
    );

}

/* =========================================================
   STORAGE
========================================================= */

function saveData(){

  localStorage.setItem(
    "railway-map-maker-data",
    JSON.stringify(data)
  );

}

function loadData(){

  try{

    const raw =
      localStorage.getItem(
        "railway-map-maker-data"
      );

    if(raw){

      const parsed =
        JSON.parse(raw);

      if(
        parsed &&
        parsed.nodes &&
        parsed.routes
      ){

        return parsed;

      }

    }

  }catch(e){

  }

  return structuredClone(
    defaultData
  );

}

/* =========================================================
   SAVE ON PAGE EXIT
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    saveData();
  }
);

</script>

</body>
